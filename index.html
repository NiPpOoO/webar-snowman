<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 55111</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
}
#status {
  position:fixed; bottom:12px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  color:#fff; padding:8px 12px;
  border-radius:6px; z-index:11;
  display:none;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay: false; loop: true; volume: 0.5"></a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');
const scene = document.querySelector('a-scene');

const markersCount = 14;

// Компонент для стабилизации и сглаживания моделей
AFRAME.registerComponent('model-stabilizer', {
  schema: {
    smoothing: { default: 0.15 },
    updateInterval: { default: 100 },
    minMoveDistance: { default: 0.05 },
    freezeAfterInit: { default: true }
  },
  init() {
    this.initialized = false;
    this.positionFrozen = false;
    this.stablePosition = null;
    this.targetPosition = null;
    this.positionHistory = [];
    this.lastUpdateTime = 0;
    this.frozenWorldMatrix = null;
  },
  tick(time) {
    const dst = this.el.object3D;
    const parent = this.el.parentEl;
    
    if (!parent || !parent.object3D) return;
    
    const src = parent.object3D;
    const currentTime = time || performance.now();
    const timeSinceUpdate = currentTime - this.lastUpdateTime;
    
    // Если позиция заморожена - фиксируем её каждый кадр
    if (this.positionFrozen && this.frozenWorldMatrix) {
      dst.matrixAutoUpdate = false;
      dst.matrixWorldNeedsUpdate = false;
      dst.position.set(0, 0, 0);
      dst.quaternion.set(0, 0, 0, 1);
      dst.updateMatrix();
      dst.matrixWorld.copy(this.frozenWorldMatrix);
      return;
    }
    
    // Проверяем видимость маркера
    const markerVisible = parent.getAttribute('visible') !== false;
    
    if (!markerVisible) {
      return;
    }
    
    // Инициализация при первом обнаружении маркера
    if (!this.initialized) {
      if (markerVisible) {
        const worldPos = new THREE.Vector3();
        src.getWorldPosition(worldPos);
        
        const isValidPos = !isNaN(worldPos.x) && !isNaN(worldPos.y) && !isNaN(worldPos.z) &&
                           (Math.abs(worldPos.x) > 0.001 || Math.abs(worldPos.y) > 0.001 || Math.abs(worldPos.z) > 0.001);
        
        if (isValidPos) {
          this.stablePosition = new THREE.Vector3(0, 0, 0);
          this.targetPosition = this.stablePosition.clone();
          this.positionHistory = [];
          for (let i = 0; i < 5; i++) {
            this.positionHistory.push(this.stablePosition.clone());
          }
          this.initialized = true;
          this.lastUpdateTime = currentTime;
          
          // Замораживаем позицию после инициализации
          if (this.data.freezeAfterInit) {
            dst.position.set(0, 0, 0);
            dst.quaternion.set(0, 0, 0, 1);
            dst.scale.set(1, 1, 1);
            dst.updateMatrix();
            if (dst.parent) {
              dst.updateMatrixWorld(true);
            }
            this.frozenWorldMatrix = dst.matrixWorld.clone();
            this.positionFrozen = true;
            dst.matrixAutoUpdate = false;
          }
        }
      }
      return;
    }
    
    // Если позиция заморожена - не обновляем
    if (this.positionFrozen) {
      return;
    }
    
    // Обновляем позицию с интервалом
    if (timeSinceUpdate >= this.data.updateInterval) {
      const currentPos = new THREE.Vector3(0, 0, 0);
      
      this.positionHistory.push(currentPos.clone());
      if (this.positionHistory.length > 5) {
        this.positionHistory.shift();
      }
      
      const sortedX = this.positionHistory.map(p => p.x).sort((a, b) => a - b);
      const sortedY = this.positionHistory.map(p => p.y).sort((a, b) => a - b);
      const sortedZ = this.positionHistory.map(p => p.z).sort((a, b) => a - b);
      const medianPos = new THREE.Vector3(
        sortedX[Math.floor(sortedX.length / 2)],
        sortedY[Math.floor(sortedY.length / 2)],
        sortedZ[Math.floor(sortedZ.length / 2)]
      );
      
      if (this.stablePosition) {
        const distance = this.stablePosition.distanceTo(medianPos);
        
        if (distance >= this.data.minMoveDistance) {
          this.targetPosition.copy(medianPos);
          this.stablePosition.lerp(this.targetPosition, this.data.smoothing);
        }
        
        dst.position.copy(this.stablePosition);
        dst.updateMatrix();
      } else {
        dst.position.set(0, 0, 0);
        dst.updateMatrix();
      }
      
      this.lastUpdateTime = currentTime;
    }
  }
});

// Функция создания маркера с моделями
function createMarker(index) {
  const marker = document.createElement('a-entity');
  marker.setAttribute('mindar-image-target', `targetIndex:${index}`);
  scene.appendChild(marker);

  // Контейнер моделей с стабилизацией
  const content = document.createElement('a-entity');
  content.setAttribute('position','0 0 0');
  content.setAttribute('model-stabilizer', 'smoothing: 0.15; updateInterval: 100; minMoveDistance: 0.05; freezeAfterInit: true');

  // Модель слев
  const leftWrapper = document.createElement('a-entity');
  leftWrapper.setAttribute('position','-0.5 -0.5 0');
  const leftModel = document.createElement('a-entity');
  leftModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox.glb');
  leftModel.setAttribute('scale','0.05 0.05 0.05');
  leftModel.setAttribute('animation-mixer','clip:*; loop:repeat');
  leftWrapper.appendChild(leftModel);
  content.appendChild(leftWrapper);

  // Модель справа
  const rightWrapper = document.createElement('a-entity');
  rightWrapper.setAttribute('position','0.5 -0.5 0');
  const rightModel = document.createElement('a-entity');
  rightModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb');
  rightModel.setAttribute('scale','0.05 0.05 0.05');
  rightModel.setAttribute('animation-mixer','clip:*; loop:repeat');
  rightWrapper.appendChild(rightModel);
  content.appendChild(rightWrapper);

  marker.appendChild(content);

  marker.addEventListener('targetFound', ()=>{
    content.setAttribute('visible', true);
    status.textContent = 'Маркер найден';
  });

  marker.addEventListener('targetLost', ()=>{
    setTimeout(()=>{
      content.setAttribute('visible', false);
      status.textContent = 'Наведи камеру на маркер';
    },200);
  });

  return marker;
}

// Создаем маркеры
for(let i=0;i<markersCount;i++){
  createMarker(i);
}

// Старт AR и музыки по кнопке
startBtn.addEventListener('click', async ()=>{
  startBtn.disabled = true;
  startScreen.style.display='none';
  status.style.display='block';
  try {
    const mindar = scene.systems['mindar-image-system'];
    await mindar.start();
    const music = document.getElementById('music');
    music.components.sound.playSound();
  } catch(e){
    alert('Камера недоступна или отказано в доступе. Обновите страницу и попробуйте снова.');
    console.error(e);
  }
});
</script>

</body>
</html>
