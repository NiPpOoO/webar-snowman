<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 2Статичные модели</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://unpkg.com/aframe@1.4.2/dist/aframe-master.min.js"></script>
<script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
  cursor:pointer;
  background:#fff;
  color:#000;
}
#start button:active {
  opacity:0.8;
}
#start button:disabled {
  opacity:0.6;
  cursor:not-allowed;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить</button>
</div>

<a-scene
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true; antialias:true;">

  <a-camera look-controls="enabled:false" position="0 0 0"></a-camera>

  <!-- Видеосфера с камерой (фон) -->
  <a-videosphere id="videoSphere" rotation="0 -90 0" visible="false" material="shader: flat; side: back;"></a-videosphere>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay: false; loop: true; volume: 0.5"></a-entity>

  <!-- Контейнер для статичных моделей -->
  <a-entity id="modelsContainer" position="0 0 -2" visible="false">

    <!-- Модель слева -->
    <a-entity
      gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
      position="-0.3 0 0"
      scale="0.05 0.05 0.05"
      animation-mixer="clip:*; loop:repeat">
    </a-entity>

    <!-- Модель справа -->
    <a-entity
      gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
      position="0.3 0 0"
      scale="0.05 0.05 0.05"
      animation-mixer="clip:*; loop:repeat">
    </a-entity>

  </a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const modelsContainer = document.getElementById('modelsContainer');
const music = document.getElementById('music');
const videoSphere = document.getElementById('videoSphere');
let videoStream = null;

async function startCamera() {
  try {
    // Запрашиваем доступ к камере
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: 'environment', // Задняя камера на мобильных
        width: { ideal: 1280 },
        height: { ideal: 720 }
      } 
    });
    
    videoStream = stream;
    
    // Создаем video элемент
    const video = document.createElement('video');
    video.srcObject = stream;
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.style.display = 'none'; // Скрываем, но оставляем в DOM
    video.style.position = 'absolute';
    video.style.width = '1px';
    video.style.height = '1px';
    document.body.appendChild(video); // Добавляем в DOM для совместимости
    
    // Ждем пока видео начнет воспроизводиться
    await new Promise((resolve) => {
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          resolve();
        }).catch(() => {
          // Если autoplay заблокирован, пробуем еще раз
          video.muted = true;
          video.play().then(resolve).catch(() => resolve());
        });
      } else {
        video.onloadedmetadata = () => resolve();
      }
    });
    
    // Применяем видео к видеосфере через Three.js
    const applyVideoTexture = () => {
      const mesh = videoSphere.getObject3D('mesh');
      if (mesh && mesh.material) {
        const THREE = AFRAME.THREE;
        const videoTexture = new THREE.VideoTexture(video);
        videoTexture.format = THREE.RGBAFormat;
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        
        mesh.material.map = videoTexture;
        mesh.material.needsUpdate = true;
      } else {
        // Если меш еще не готов, пробуем через некоторое время
        setTimeout(applyVideoTexture, 100);
      }
    };
    
    // Пробуем применить сразу или после загрузки
    if (videoSphere.hasLoaded) {
      applyVideoTexture();
    } else {
      videoSphere.addEventListener('loaded', applyVideoTexture);
    }
    
    // Показываем видеосферу
    videoSphere.setAttribute('visible', true);
    
    return true;
  } catch(error) {
    console.error('Ошибка доступа к камере:', error);
    alert('Не удалось получить доступ к камере. Разрешите доступ к камере в настройках браузера.');
    return false;
  }
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = 'Загрузка...';
  
  // Запускаем камеру
  const cameraStarted = await startCamera();
  
  if (!cameraStarted) {
    startBtn.disabled = false;
    startBtn.textContent = 'Запустить';
    return;
  }
  
  startScreen.style.display = 'none';

  // Запускаем музыку
  if (music && music.components && music.components.sound) {
    music.components.sound.playSound();
  }

  // Появление моделей через 5 секунд
  setTimeout(() => {
    modelsContainer.setAttribute('visible', true);
  }, 5000);
});

// Очистка при закрытии страницы
window.addEventListener('beforeunload', () => {
  if (videoStream) {
    videoStream.getTracks().forEach(track => track.stop());
  }
});
</script>

</body>
</html>
