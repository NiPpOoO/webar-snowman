<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>WebAR: Снеговик + Модели</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.6.0/dist/aframe-master.min.js"></script>
    <!-- AR.js с поддержкой NFT -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
      #status {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 8px 12px;
        background: rgba(0,0,0,0.6);
        color: #fff;
        border-radius: 6px;
        font-size: 14px;
      }
      #switchBtn {
        position: absolute;
        top: 50px;
        right: 10px;
        padding: 8px 12px;
        background: rgba(0,0,0,0.6);
        color: #fff;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body style="margin:0; overflow:hidden;">
    <!-- Лоадер -->
    <div class="arjs-loader">
      <div>Загрузка маркера, подождите…</div>
    </div>

    <!-- Индикатор состояния -->
    <div id="status">Снеговик не виден</div>
    <!-- Кнопка переключения -->
    <button id="switchBtn">Сменить модель</button>

    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true; precision: medium;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- NFT-маркер снеговика -->
      <a-nft
        id="snowman-marker"
        type="nft"
        url="https://nippooo.github.io/webar-snowman/assets/markers/snowman/snowman"
        emitevents="true"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5"
      >
        <!-- Модель (по умолчанию Лиса) -->
        <a-entity
          id="modelEntity"
          gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
          scale="0.3 0.3 0.3"
          position="0 0 0"
          visible="false"
        ></a-entity>
      </a-nft>

      <!-- Камера -->
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const marker = document.getElementById('snowman-marker');
      const status = document.getElementById('status');
      const switchBtn = document.getElementById('switchBtn');
      const modelEntity = document.getElementById('modelEntity');

      // Список моделей
      const models = [
        "https://nippooo.github.io/webar-snowman/assets/models/Fox.glb",
        "https://nippooo.github.io/webar-snowman/assets/models/Penguin.glb",
        "https://nippooo.github.io/webar-snowman/assets/models/Bear.glb"
      ];
      let currentIndex = 0;

      // События маркера
      marker.addEventListener('markerFound', () => {
        console.log("[AR.js] Снеговик виден");
        status.textContent = "Снеговик виден";
        modelEntity.setAttribute('visible', true);
      });

      marker.addEventListener('markerLost', () => {
        console.log("[AR.js] Снеговик не виден");
        status.textContent = "Снеговик не виден";
        // модель остаётся видимой
      });

      // Переключение модели
      switchBtn.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % models.length;
        modelEntity.setAttribute('gltf-model', models[currentIndex]);
        console.log("Модель переключена на:", models[currentIndex]);
      });
    </script>
  </body>
</html>
