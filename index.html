<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — Fixed Models</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:true;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- 6 маркеров -->
  <a-entity id="marker0" mindar-image-target="targetIndex:0"></a-entity>
  <a-entity id="marker1" mindar-image-target="targetIndex:1"></a-entity>
  <a-entity id="marker2" mindar-image-target="targetIndex:2"></a-entity>
  <a-entity id="marker3" mindar-image-target="targetIndex:3"></a-entity>
  <a-entity id="marker4" mindar-image-target="targetIndex:4"></a-entity>
  <a-entity id="marker5" mindar-image-target="targetIndex:5"></a-entity>

  <!-- Независимые контейнеры для моделей -->
  <a-entity id="fixed0" visible="false"></a-entity>
  <a-entity id="fixed1" visible="false"></a-entity>
  <a-entity id="fixed2" visible="false"></a-entity>
  <a-entity id="fixed3" visible="false"></a-entity>
  <a-entity id="fixed4" visible="false"></a-entity>
  <a-entity id="fixed5" visible="false"></a-entity>

</a-scene>

<script>
function setupMarker(markerId, fixedId) {
  const marker = document.getElementById(markerId);
  const fixed = document.getElementById(fixedId);

  // Добавляем модели в контейнер fixed
  const leftModel = document.createElement('a-entity');
  leftModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox.glb');
  leftModel.setAttribute('scale','0.05 0.05 0.05');
  leftModel.setAttribute('position','-0.5 -0.5 0');
  leftModel.setAttribute('animation-mixer','clip:*; loop:repeat');

  const rightModel = document.createElement('a-entity');
  rightModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb');
  rightModel.setAttribute('scale','0.05 0.05 0.05');
  rightModel.setAttribute('position','0.5 -0.5 0');
  rightModel.setAttribute('animation-mixer','clip:*; loop:repeat');

  fixed.appendChild(leftModel);
  fixed.appendChild(rightModel);

  marker.addEventListener('targetFound', () => {
    // Получаем мировые координаты маркера
    const worldPos = new THREE.Vector3();
    const worldQuat = new THREE.Quaternion();
    marker.object3D.getWorldPosition(worldPos);
    marker.object3D.getWorldQuaternion(worldQuat);

    // Переносим контейнер fixed в эти координаты
    fixed.object3D.position.copy(worldPos);
    fixed.object3D.quaternion.copy(worldQuat);

    fixed.setAttribute('visible', true);
  });

  marker.addEventListener('targetLost', () => {
    // НЕ скрываем — модели остаются навсегда
  });
}

// Настраиваем все 6 маркеров
for (let i = 0; i < 6; i++) {
  setupMarker(`marker${i}`, `fixed${i}`);
}
</script>

</body>
</html>
