<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>M1indAR CLEAN TEST</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>
</head>

<body style="margin:0; overflow:hidden">

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:true"
  embedded>

  <a-camera look-controls="enabled:false"></a-camera>

  <a-entity id="marker" mindar-image-target="targetIndex:0"></a-entity>

</a-scene>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.1/examples/js/loaders/GLTFLoader.js"></script>
<script>
const scene = document.querySelector('a-scene');
const marker = document.getElementById('marker');

let modelContainer = new THREE.Group();
scene.object3D.add(modelContainer);
modelContainer.visible = false;

let currentPos = new THREE.Vector3();
let targetPos = new THREE.Vector3();
let currentQuat = new THREE.Quaternion();
let targetQuat = new THREE.Quaternion();

const POSITION_SMOOTH = 0.18;
const ROTATION_SMOOTH = 0.1;

const loader = new THREE.GLTFLoader();
const models = [
  { url: 'https://nippooo.github.io/webar-snowman/assets/models/Fox.glb', pos: [0,0,0] },
  { url: 'https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb', pos: [0.5,0,0] },
];

Promise.all(models.map(m => new Promise(resolve => {
  loader.load(m.url, gltf => {
    gltf.scene.position.set(...m.pos);
    gltf.scene.scale.set(0.05,0.05,0.05);
    modelContainer.add(gltf.scene);
    resolve();
  });
}))).then(() => {
  console.log('All models loaded');
});

let markerFound = false;

marker.addEventListener('targetFound', () => {
  markerFound = true;
  modelContainer.visible = true;
});

marker.addEventListener('targetLost', () => {
  markerFound = false;
});

scene.addEventListener('frame', () => {
  if (!markerFound) return;

  marker.object3D.getWorldPosition(targetPos);
  marker.object3D.getWorldQuaternion(targetQuat);

  currentPos.lerp(targetPos, POSITION_SMOOTH);
  currentQuat.slerp(targetQuat, ROTATION_SMOOTH);

  modelContainer.position.copy(currentPos);
  modelContainer.quaternion.copy(currentQuat);
});
</script>

</html>
