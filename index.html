<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 107</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
}
#status {
  position:fixed; bottom:12px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  color:#fff; padding:8px 12px;
  border-radius:6px; z-index:11;
  display:none;
}
</style>
</head>

<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart: false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- ===== 6 МАРКЕРОВ С ОДНИМ И ТЕМ ЖЕ КОНТЕНТОМ ===== -->

  <!-- ФУНКЦИЯ КОНТЕНТА: снеговик + второй персонаж -->
  <template id="content-template">
    <a-entity position="0 0 0">

      <a-entity position="-0.3 -0.3 0">
        <a-entity
          gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
          scale="0.3 0.3 0.3"
          animation-mixer="clip:*; loop:repeat">
        </a-entity>
      </a-entity>

      <a-entity position="0.3 -0.3 0">
        <a-entity
          gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
          scale="0.25 0.25 0.25"
          animation-mixer="clip:*; loop:repeat">
        </a-entity>
      </a-entity>

    </a-entity>
  </template>

  <!-- МАРКЕРЫ -->
  <a-entity mindar-image-target="targetIndex:0" class="marker"></a-entity>
  <a-entity mindar-image-target="targetIndex:1" class="marker"></a-entity>
  <a-entity mindar-image-target="targetIndex:2" class="marker"></a-entity>
  <a-entity mindar-image-target="targetIndex:3" class="marker"></a-entity>
  <a-entity mindar-image-target="targetIndex:4" class="marker"></a-entity>
  <a-entity mindar-image-target="targetIndex:5" class="marker"></a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const status = document.getElementById('status');
const scene = document.querySelector('a-scene');
const markers = document.querySelectorAll('.marker');
const template = document.getElementById('content-template');

markers.forEach(marker => {
  marker.appendChild(template.content.cloneNode(true));

  marker.addEventListener('targetFound', () => {
    status.textContent = 'Маркер найден';
  });

  marker.addEventListener('targetLost', () => {
    status.textContent = 'Наведи камеру на маркер';
  });
});

startBtn.addEventListener('click', async () => {
  document.getElementById('start').style.display = 'none';
  status.style.display = 'block';
  await scene.systems['mindar-image-system'].start();
});
</script>

</body>
</html>
