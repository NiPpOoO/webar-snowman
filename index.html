<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — Camera + HUD</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR (нужен ТОЛЬКО для камеры) -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}
#start{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  z-index:10;
}
#start button{
  padding:16px 28px;
  font-size:16px;
  border-radius:12px;
  border:none;
}
</style>
</head>

<body>

<div id="start">
  <button id="startBtn">Запустить камеру</button>
</div>

<a-scene
  mindar-image="autoStart:false"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true"
  embedded>

  <!-- 🎥 КАМЕРА -->
  <a-camera look-controls="enabled:false">

    <!-- 🔥 HUD — ВСЕГДА ПОВЕРХ КАМЕРЫ -->
    <a-entity position="0 0 -2">

      <!-- Левая модель -->
      <a-entity
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
        position="-0.6 -0.4 0"
        scale="0.05 0.05 0.05"
        animation-mixer>
      </a-entity>

      <!-- Правая модель -->
      <a-entity
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
        position="0.6 -0.4 0"
        scale="0.05 0.05 0.05"
        animation-mixer>
      </a-entity>

    </a-entity>

  </a-camera>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const scene = document.querySelector('a-scene');

startBtn.onclick = async ()=>{
  startBtn.disabled = true;
  startScreen.style.display = 'none';

  try{
    const mindar = scene.systems['mindar-image-system'];
    await mindar.start(); // просто включаем камеру
  }catch(e){
    alert('Не удалось получить доступ к камере');
    console.error(e);
  }
};
</script>

</body>
</html>
