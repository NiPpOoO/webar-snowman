<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>22ebAR Snowman</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-master.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #start {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #startBtn {
      padding: 20px 40px;
      font-size: 24px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #startBtn:hover {
      background: #45a049;
    }
    #status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      z-index: 999;
      display: none;
    }
  </style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Модели закреплены перед камерой</div>

<a-scene
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true"
  embedded>

  <!-- Видео с камеры как фон -->
  <a-videosphere id="camera-video" rotation="0 -90 0" material="src: #camera-stream"></a-videosphere>

  <a-camera look-controls="enabled:false">
    <!-- Модели закреплены перед камерой -->
    <a-entity id="models-container" position="0 -0.5 -1.5" rotation="0 0 0">
      <!-- Модель слева -->
      <a-entity id="left-model" position="-0.2 0 0" rotation="0 0 0">
        <a-entity 
          gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
          scale="0.05 0.05 0.05"
          animation-mixer="clip:*; loop:repeat"
          visible="true">
        </a-entity>
      </a-entity>
      
      <!-- Модель справа -->
      <a-entity id="right-model" position="0.2 0 0" rotation="0 0 0">
        <a-entity 
          gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
          scale="0.05 0.05 0.05"
          animation-mixer="clip:*; loop:repeat"
          visible="true">
        </a-entity>
      </a-entity>
    </a-entity>
  </a-camera>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay: false; loop: true; volume: 0.5"></a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');
const scene = document.querySelector('a-scene');

// Упрощенный запуск - камера, модели и музыка
startBtn.addEventListener('click', async ()=>{
  startBtn.disabled = true;
  startScreen.style.display='none';
  status.style.display='block';
  status.textContent = 'Запрос доступа к камере...';
  
  try {
    // Ждём, пока сцена полностью загрузится
    if (!scene.hasLoaded) {
      await new Promise(resolve =>
        scene.addEventListener('loaded', resolve, { once:true })
      );
    }
    
    // Запрашиваем доступ к камере
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: 'environment', // Используем заднюю камеру на мобильных
        width: { ideal: 1280 },
        height: { ideal: 720 }
      } 
    });
    
    // Создаем видео элемент для камеры
    let video = document.getElementById('camera-stream');
    if (!video) {
      video = document.createElement('video');
      video.id = 'camera-stream';
      video.autoplay = true;
      video.playsInline = true;
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');
      video.style.display = 'none'; // Скрываем видео элемент
      video.style.position = 'absolute';
      video.style.width = '1px';
      video.style.height = '1px';
      document.body.appendChild(video);
    }
    
    video.srcObject = stream;
    
    // Ждем, пока видео начнет воспроизводиться
    await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => {
        reject(new Error('Таймаут загрузки видео'));
      }, 10000);
      
      video.addEventListener('loadedmetadata', () => {
        clearTimeout(timeout);
        video.play().then(() => {
          resolve();
        }).catch(reject);
      }, { once: true });
      
      video.addEventListener('error', (e) => {
        clearTimeout(timeout);
        reject(new Error('Ошибка воспроизведения видео: ' + e.message));
      }, { once: true });
    });
    
    // Обновляем видеосферу с потоком камеры
    const videoSphere = document.getElementById('camera-video');
    if (videoSphere) {
      // Ждем немного, чтобы видео точно загрузилось
      await new Promise(resolve => setTimeout(resolve, 100));
      videoSphere.setAttribute('material', 'src', '#camera-stream');
      console.log('Видеосфера обновлена с потоком камеры');
    } else {
      console.warn('Видеосфера не найдена');
    }
    
    // Запускаем музыку
    const music = document.getElementById('music');
    if (music && music.components && music.components.sound) {
      music.components.sound.playSound();
    } else {
      console.warn('Компонент звука не найден или еще не загружен');
    }
    
    status.textContent = 'Модели закреплены перед камерой';
  } catch(e){
    let errorMsg = 'Ошибка при запуске камеры. ';
    if (e.name === 'NotAllowedError') {
      errorMsg += 'Разрешите доступ к камере в настройках браузера.';
    } else if (e.name === 'NotFoundError') {
      errorMsg += 'Камера не найдена.';
    } else {
      errorMsg += 'Обновите страницу и попробуйте снова.';
    }
    alert(errorMsg);
    console.error(e);
    // Восстанавливаем UI при ошибке
    startBtn.disabled = false;
    startScreen.style.display='flex';
    status.style.display='none';
  }
});
</script>

</body>
</html>
