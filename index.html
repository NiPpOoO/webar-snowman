<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — Fixed Models</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:true;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Пустой маркер -->
  <a-entity id="marker" mindar-image-target="targetIndex:0"></a-entity>

  <!-- Модели вне маркера -->
  <a-entity id="foxLeft" gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
            scale="0.05 0.05 0.05"
            visible="false"
            animation-mixer="clip:*; loop:repeat">
  </a-entity>

  <a-entity id="foxRight" gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
            scale="0.05 0.05 0.05"
            visible="false"
            animation-mixer="clip:*; loop:repeat">
  </a-entity>

</a-scene>

<script>
const marker = document.getElementById('marker');
const foxLeft = document.getElementById('foxLeft');
const foxRight = document.getElementById('foxRight');

marker.addEventListener('targetFound', () => {
  // получаем мировые координаты маркера
  const worldPos = new THREE.Vector3();
  const worldQuat = new THREE.Quaternion();
  marker.object3D.getWorldPosition(worldPos);
  marker.object3D.getWorldQuaternion(worldQuat);

  // переносим в модели
  foxLeft.object3D.position.copy(worldPos);
  foxLeft.object3D.quaternion.copy(worldQuat);
  foxRight.object3D.position.copy(worldPos);
  foxRight.object3D.quaternion.copy(worldQuat);

  // делаем видимыми
  foxLeft.setAttribute('visible', true);
  foxRight.setAttribute('visible', true);
});

marker.addEventListener('targetLost', () => {
  // НЕ скрываем — модели остаются навсегда
});
</script>

</body>
</html>
