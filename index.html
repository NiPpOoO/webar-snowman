<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 443111</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://unpkg.com/aframe@1.4.2/dist/aframe-master.min.js"></script>
<script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR -->
<script src="https://unpkg.com/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://unpkg.com/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; touch-action:none; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
#start button:active {
  opacity:0.8;
}
#status {
  position:fixed; bottom:12px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  color:#fff; padding:8px 12px;
  border-radius:6px; z-index:11;
  display:none;
  font-size:14px;
  text-align:center;
  max-width:90%;
  pointer-events:none;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true; antialias:true;">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay: false; loop: true; volume: 0.5"></a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');
const scene = document.querySelector('a-scene');

// Конфигурация: 7 снеговиков, по 3 маркера на каждого (итого 21 маркер)
const snowmenCount = 7;
const markersPerSnowman = 3;
const totalMarkers = snowmenCount * markersPerSnowman; // 21

// Компонент для максимальной стабилизации моделей с фильтрацией
AFRAME.registerComponent('model-stabilizer', {
  schema: {
    freezeAfterInit: { default: true },
    stabilizationDelay: { default: 1000 }, // Задержка перед заморозкой (мс)
    stabilityThreshold: { default: 0.01 }  // Порог стабильности позиции
  },
  init() {
    this.initialized = false;
    this.positionFrozen = false;
    this.frozenWorldMatrix = null;
    this.frozenLocalMatrix = null;
    this.frozenScale = new THREE.Vector3(1, 1, 1);
    this.frozenQuaternion = new THREE.Quaternion(0, 0, 0, 1);
    
    // Для фильтрации перед заморозкой
    this.positionHistory = [];
    this.stableStartTime = null;
    this.lastStablePosition = null;
    this.stabilizationSamples = 50; // Количество образцов для стабилизации (увеличено для лучшей фильтрации)
  },
  tick() {
    const dst = this.el.object3D;
    const parent = this.el.parentEl;
    
    if (!parent || !parent.object3D) return;
    
    const markerVisible = parent.getAttribute('visible') !== false;
    const currentTime = performance.now();
    
    // Если позиция уже заморожена - ПРИНУДИТЕЛЬНО фиксируем каждый кадр
    if (this.positionFrozen && this.frozenWorldMatrix && markerVisible) {
      // ПРИНУДИТЕЛЬНО устанавливаем все параметры каждый кадр
      // Используем прямую установку через матрицу для максимальной стабильности
      dst.position.set(0, 0, 0);
      dst.quaternion.copy(this.frozenQuaternion);
      dst.scale.copy(this.frozenScale);
      
      // Восстанавливаем локальную матрицу
      dst.matrix.copy(this.frozenLocalMatrix);
      
      // ПРИНУДИТЕЛЬНО устанавливаем замороженную мировую матрицу
      // Это полностью перезаписывает любые изменения от MindAR
      dst.matrixWorld.copy(this.frozenWorldMatrix);
      
      // Дополнительная защита: блокируем обновления через родителя
      if (dst.parent) {
        dst.parent.matrixWorldNeedsUpdate = false;
      }
      
      // Блокируем обновления снова (на случай, если что-то их включило)
      dst.matrixAutoUpdate = false;
      dst.matrixWorldNeedsUpdate = false;
      
      // Дополнительная проверка: если матрица все же изменилась, восстанавливаем
      if (!dst.matrixWorld.equals(this.frozenWorldMatrix)) {
        dst.matrixWorld.copy(this.frozenWorldMatrix);
      }
      
      return;
    }
    
    // Инициализация и стабилизация перед заморозкой
    if (!this.initialized && markerVisible) {
      // Устанавливаем начальную позицию
      dst.position.set(0, 0, 0);
      dst.quaternion.set(0, 0, 0, 1);
      dst.scale.set(1, 1, 1);
      
      // Обновляем матрицы
      dst.updateMatrix();
      if (dst.parent) {
        dst.updateMatrixWorld(true);
      }
      
      // Собираем историю позиций для фильтрации
      const worldPos = new THREE.Vector3();
      dst.getWorldPosition(worldPos);
      
      this.positionHistory.push({
        position: worldPos.clone(),
        matrix: dst.matrixWorld.clone(),
        time: currentTime
      });
      
      // Ограничиваем размер истории
      if (this.positionHistory.length > this.stabilizationSamples) {
        this.positionHistory.shift();
      }
      
      // Проверяем стабильность позиции
      if (this.positionHistory.length >= this.stabilizationSamples) {
        // Вычисляем медианную позицию
        const positions = this.positionHistory.map(p => p.position);
        const sortedX = positions.map(p => p.x).sort((a, b) => a - b);
        const sortedY = positions.map(p => p.y).sort((a, b) => a - b);
        const sortedZ = positions.map(p => p.z).sort((a, b) => a - b);
        const medianPos = new THREE.Vector3(
          sortedX[Math.floor(sortedX.length / 2)],
          sortedY[Math.floor(sortedY.length / 2)],
          sortedZ[Math.floor(sortedZ.length / 2)]
        );
        
        // Проверяем, насколько стабильна позиция
        let maxDeviation = 0;
        for (const p of positions) {
          const deviation = p.distanceTo(medianPos);
          if (deviation > maxDeviation) {
            maxDeviation = deviation;
          }
        }
        
        // Если позиция стабильна и прошло достаточно времени
        if (maxDeviation < this.data.stabilityThreshold) {
          if (!this.stableStartTime) {
            this.stableStartTime = currentTime;
            this.lastStablePosition = medianPos.clone();
          } else {
            // Проверяем, что позиция не изменилась значительно
            const positionChange = medianPos.distanceTo(this.lastStablePosition);
            if (positionChange > this.data.stabilityThreshold * 2) {
              // Позиция изменилась - сбрасываем таймер
              this.stableStartTime = currentTime;
              this.lastStablePosition = medianPos.clone();
            } else {
              const stableDuration = currentTime - this.stableStartTime;
              
              // Если позиция стабильна достаточно долго - замораживаем
              if (stableDuration >= this.data.stabilizationDelay) {
                // Используем медианную матрицу из последних стабильных образцов
                const stableSamples = this.positionHistory.slice(-10);
                const medianIndex = Math.floor(stableSamples.length / 2);
                const stableData = stableSamples[medianIndex];
                
                // ЗАПОМИНАЕМ матрицы и параметры для полной фиксации
                this.frozenLocalMatrix = dst.matrix.clone();
                this.frozenWorldMatrix = stableData.matrix.clone();
                this.frozenScale.copy(dst.scale);
                this.frozenQuaternion.copy(dst.quaternion);
                
                // Блокируем все автоматические обновления
                dst.matrixAutoUpdate = false;
                dst.matrixWorldNeedsUpdate = false;
                
                this.initialized = true;
                this.positionFrozen = true;
                
                // Очищаем историю
                this.positionHistory = [];
              }
            }
          }
        } else {
          // Позиция нестабильна - сбрасываем таймер
          this.stableStartTime = null;
          this.lastStablePosition = null;
        }
      }
    } else if (!markerVisible) {
      // Маркер потерян - сбрасываем состояние
      this.initialized = false;
      this.positionFrozen = false;
      this.positionHistory = [];
      this.stableStartTime = null;
      this.lastStablePosition = null;
      dst.matrixAutoUpdate = true;
    }
  }
});

// Создаем группы маркеров для каждого снеговика
const markerGroups = [];

for (let snowmanIndex = 0; snowmanIndex < snowmenCount; snowmanIndex++) {
  const group = {
    snowmanIndex: snowmanIndex,
    markers: [],
    content: null,
    activeMarker: null,
    contentEntity: null
  };
  
  // Создаем общий контейнер для моделей этого снеговика
  const content = document.createElement('a-entity');
  content.setAttribute('position', '0 0 0');
  content.setAttribute('visible', false);
  content.setAttribute('model-stabilizer', 'freezeAfterInit: true; stabilizationDelay: 2000; stabilityThreshold: 0.008');
  
  // Модель слева
  const leftWrapper = document.createElement('a-entity');
  leftWrapper.setAttribute('position', '-0.3 0 0');
  const leftModel = document.createElement('a-entity');
  leftModel.setAttribute('gltf-model', 'https://nippooo.github.io/webar-snowman/assets/models/Fox.glb');
  leftModel.setAttribute('scale', '0.05 0.05 0.05');
  leftModel.setAttribute('animation-mixer', 'clip:*; loop:repeat');
  leftWrapper.appendChild(leftModel);
  content.appendChild(leftWrapper);
  
  // Модель справа
  const rightWrapper = document.createElement('a-entity');
  rightWrapper.setAttribute('position', '0.3 0 0');
  const rightModel = document.createElement('a-entity');
  rightModel.setAttribute('gltf-model', 'https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb');
  rightModel.setAttribute('scale', '0.05 0.05 0.05');
  rightModel.setAttribute('animation-mixer', 'clip:*; loop:repeat');
  rightWrapper.appendChild(rightModel);
  content.appendChild(rightWrapper);
  
  group.contentEntity = content;
  
  // Создаем 3 маркера для этого снеговика
  for (let markerOffset = 0; markerOffset < markersPerSnowman; markerOffset++) {
    const markerIndex = snowmanIndex * markersPerSnowman + markerOffset;
    
    const marker = document.createElement('a-entity');
    marker.setAttribute('mindar-image-target', `targetIndex:${markerIndex}`);
    marker.setAttribute('visible', false);
    scene.appendChild(marker);
    
    group.markers.push(marker);
    
    // Обработчики событий для маркера
    marker.addEventListener('targetFound', () => {
      // Если контейнер уже прикреплен к другому маркеру, открепляем его
      if (group.contentEntity.parentNode && group.contentEntity.parentNode !== marker) {
        group.contentEntity.parentNode.removeChild(group.contentEntity);
      }
      
      // Если контейнер еще не прикреплен, добавляем к текущему маркеру
      if (!group.contentEntity.parentNode) {
        marker.appendChild(group.contentEntity);
      }
      
      group.activeMarker = marker;
      group.contentEntity.setAttribute('visible', true);
      status.textContent = `Снеговик ${snowmanIndex + 1} найден`;
    });
    
    marker.addEventListener('targetLost', () => {
      // Проверяем, что это текущий активный маркер
      if (group.activeMarker === marker) {
        setTimeout(() => {
          // Проверяем, не стал ли активным другой маркер из группы
          let otherActive = false;
          for (const m of group.markers) {
            if (m !== marker && m.getAttribute('visible') !== false) {
              otherActive = true;
              // Перемещаем контейнер к новому активному маркеру
              if (group.contentEntity.parentNode) {
                group.contentEntity.parentNode.removeChild(group.contentEntity);
              }
              m.appendChild(group.contentEntity);
              group.activeMarker = m;
              break;
            }
          }
          
          if (!otherActive) {
            group.contentEntity.setAttribute('visible', false);
            group.activeMarker = null;
            status.textContent = 'Наведи камеру на маркер';
          }
        }, 200);
      }
    });
  }
  
  group.content = content;
  markerGroups.push(group);
}

// Старт AR и музыки по кнопке
startBtn.addEventListener('click', async () => {
  // Предотвращаем множественные клики
  if (startBtn.disabled) return;
  
  startBtn.disabled = true;
  startBtn.style.opacity = '0.6';
  startScreen.style.display = 'none';
  status.style.display = 'block';
  status.textContent = 'Запуск...';
  
  try {
    // Ждём, пока сцена полностью загрузится
    if (!scene.hasLoaded) {
      await new Promise(resolve =>
        scene.addEventListener('loaded', resolve, { once: true })
      );
    }
    
    status.textContent = 'Инициализация камеры...';
    
    // Проверяем наличие системы MindAR
    const mindar = scene.systems['mindar-image-system'];
    if (!mindar) {
      throw new Error('MindAR система не найдена. Убедитесь, что скрипты загружены.');
    }
    
    await mindar.start();
    
    status.textContent = 'Наведи камеру на маркер';
    
    // Запускаем музыку
    const music = document.getElementById('music');
    if (music && music.components && music.components.sound) {
      music.components.sound.playSound();
    } else {
      console.warn('Компонент звука не найден или еще не загружен');
    }
  } catch(e) {
    console.error('Ошибка запуска AR:', e);
    alert('Ошибка: ' + (e.message || 'Камера недоступна или отказано в доступе. Обновите страницу и попробуйте снова.'));
    // Восстанавливаем UI при ошибке
    startBtn.disabled = false;
    startBtn.style.opacity = '1';
    startScreen.style.display = 'flex';
    status.style.display = 'none';
  }
});

// Улучшенная обработка касаний для мобильных устройств
let touchHandled = false;
startBtn.addEventListener('touchstart', (e) => {
  if (!touchHandled) {
    touchHandled = true;
    e.preventDefault();
    startBtn.click();
    setTimeout(() => { touchHandled = false; }, 300);
  }
}, { passive: false });

// Дополнительная обработка для всех типов событий
startBtn.addEventListener('mousedown', (e) => {
  e.preventDefault();
});

// Убеждаемся, что кнопка кликабельна
startBtn.style.pointerEvents = 'auto';
startBtn.style.userSelect = 'none';
startBtn.style.webkitUserSelect = 'none';
</script>
</body>
</html>
