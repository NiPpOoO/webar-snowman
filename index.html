<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 33</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

#start{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
  background:#000;
}

#start button{
  padding:16px 26px;
  font-size:16px;
  border-radius:10px;
  border:none;
}

#status{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.65);
  color:#fff;
  padding:8px 12px;
  border-radius:6px;
  font-size:14px;
  z-index:11;
  display:none;
}

a-scene{
  position:fixed !important;
  inset:0;
  background:transparent !important;
}
</style>
</head>

<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>

<div id="status">Наведи камеру на маркер</div>

<a-scene
  id="scene"
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false"
  vr-mode-ui="enabled:false"
  renderer="alpha:true"
>
  <a-camera look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex:0">
    <a-box
      position="0 0 0"
      width="0.25"
      height="0.25"
      depth="0.25"
      color="#ff0000">
    </a-box>
  </a-entity>
</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');
const scene = document.getElementById('scene');

startBtn.addEventListener('click', async () => {
  startScreen.style.display = 'none';
  status.style.display = 'block';

  const mindarSystem = scene.systems['mindar-image-system'];
  try {
    await mindarSystem.start();
    console.log('MindAR запущен');
  } catch(e) {
    alert('Safari заблокировал камеру. Обнови страницу и нажми кнопку ещё раз.');
    console.error(e);
  }
});
</script>

</body>
</html>
