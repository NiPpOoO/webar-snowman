<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — Final</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
  cursor:pointer;
}
#status {
  position:fixed; bottom:12px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  color:#fff; padding:8px 12px;
  border-radius:6px; z-index:11;
  display:none;
  font-family:sans-serif;
  font-size:14px;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="colorManagement:true; alpha:true;"
  embedded>

  <a-assets>
    <!-- Предзагрузка моделей и звуков -->
    <audio id="music-src" src="https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3" preload="auto"></audio>
    <a-asset-item id="fox-model" src="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"></a-asset-item>
    <a-asset-item id="fox1-model" src="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <!-- Сцена с освещением -->
  <a-entity light="type: ambient; color: #FFF; intensity: 0.7"></a-entity>
  <a-entity light="type: directional; color: #FFF; intensity: 0.5; position: 1 1 1"></a-entity>

  <!-- Маркер (только один, так как в файле .mind вероятно одно изображение) -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-entity id="content" position="0 0 0" visible="false">
      <!-- Левая модель -->
      <a-entity position="-0.3 0 0.1" scale="0.02 0.02 0.02" rotation="0 180 0">
        <a-entity gltf-model="#fox-model" animation-mixer="clip: Walk; loop: repeat"></a-entity>
      </a-entity>
      
      <!-- Правая модель -->
      <a-entity position="0.3 0 0.1" scale="0.02 0.02 0.02" rotation="0 180 0">
        <a-entity gltf-model="#fox1-model" animation-mixer="clip: Walk; loop: repeat"></a-entity>
      </a-entity>
    </a-entity>
  </a-entity>

  <!-- Музыка -->
  <a-entity sound="src: #music-src; autoplay: false; loop: true; volume: 0.5"></a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');
const scene = document.querySelector('a-scene');
const content = document.getElementById('content');

let isPlaying = false;

// Обработчики событий маркера
const marker = document.querySelector('[mindar-image-target]');
const music = document.querySelector('[sound]');

marker.addEventListener('targetFound', (event) => {
  console.log('Маркер найден!');
  content.setAttribute('visible', true);
  status.textContent = 'Маркер найден!';
  
  // Запускаем музыку при первом обнаружении маркера
  if (!isPlaying) {
    music.components.sound.playSound();
    isPlaying = true;
  }
});

marker.addEventListener('targetLost', (event) => {
  console.log('Маркер потерян');
  content.setAttribute('visible', false);
  status.textContent = 'Наведи камеру на маркер';
});

// Старт AR по кнопке
startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = 'Загрузка...';
  
  try {
    // Запрашиваем разрешение на камеру перед запуском AR
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: 'environment' } 
    });
    
    // Останавливаем поток, так как MindAR запустит свой
    stream.getTracks().forEach(track => track.stop());
    
    // Скрываем стартовый экран
    startScreen.style.display = 'none';
    status.style.display = 'block';
    
    // Запускаем MindAR
    const mindar = scene.systems['mindar-image-system'];
    await mindar.start();
    
    // Показываем инструкцию
    status.textContent = 'Наведи камеру на маркер';
    
  } catch(error) {
    console.error('Ошибка запуска AR:', error);
    
    if (error.name === 'NotAllowedError') {
      alert('Доступ к камере запрещен. Разрешите доступ к камере в настройках браузера и обновите страницу.');
    } else if (error.name === 'NotFoundError') {
      alert('Камера не найдена. Убедитесь, что камера подключена и доступна.');
    } else {
      alert('Ошибка при запуске AR: ' + error.message);
    }
    
    // Восстанавливаем кнопку
    startBtn.disabled = false;
    startBtn.textContent = 'Запустить AR';
  }
});

// Обработка ошибок загрузки
scene.addEventListener('loaded', () => {
  console.log('Сцена загружена');
});

// Показать кнопку, если AR не поддерживается
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  startBtn.textContent = 'AR не поддерживается вашим устройством';
  startBtn.disabled = true;
}

// Проверка поддержки WebGL
if (!AFRAME.utils.device.checkWebGLRenderer()) {
  startBtn.textContent = 'WebGL не поддерживается';
  startBtn.disabled = true;
}
</script>

</body>
</html>
