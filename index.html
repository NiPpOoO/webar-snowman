<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 4422</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
}
#status {
  position:fixed; bottom:12px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  color:#fff; padding:8px 12px;
  border-radius:6px; z-index:11;
  display:none;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay: false; loop: true; volume: 0.5"></a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');
const scene = document.querySelector('a-scene');

const markersCount = 10; // Увеличено до 10 для поддержки всех маркеров

// Компонент для УЛЬТРА-стабилизации модели - полностью убирает дрожание
AFRAME.registerComponent('soft-stabilizer', {
  schema: {
    lockY: { default: true },           // Фиксировать вертикальную ось
    lockRot: { default: true },         // Блокировать повороты полностью
    smoothing: { default: 0.1 },       // Сглаживание при обновлении
    minMoveDistance: { default: 0.5 },  // Порог для обновления (в единицах) - увеличен для больших движений
    updateInterval: { default: 5000 }   // Интервал обновления в мс (5000 = 5 секунд)
  },
  init() {
    console.log('soft-stabilizer: инициализация компонента');
    this.isVisible = false;
    this.initialY = null;
    this.stablePosition = null;
    this.targetPosition = null;
    this.initialized = false;
    this.lastUpdateTime = 0;
    this.positionHistory = []; // История для медианного фильтра
    this.tickCount = 0; // Счетчик для отладки
  },
  tick(time) {
    this.tickCount++;
    // Логируем каждые 60 кадров (примерно раз в секунду при 60 FPS)
    if (this.tickCount % 60 === 0) {
      console.log('soft-stabilizer: tick вызывается, initialized:', this.initialized);
    }
    
    const parent = this.el.parentEl;
    if (!parent) {
      if (this.tickCount % 60 === 0) console.log('soft-stabilizer: нет родителя');
      return;
    }

    const src = parent.object3D;
    const dst = this.el.object3D;

    // Улучшенная проверка видимости маркера
    // Проверяем через событие targetFound, а не через позицию
    const markerVisible = parent.getAttribute('visible') !== false;
    
    // НЕ сбрасываем инициализацию при временной потере маркера
    // Это критично для стабильности!
    if (!markerVisible) {
      this.el.setAttribute('visible', false);
      this.isVisible = false;
      // НЕ сбрасываем initialized - сохраняем позицию!
      // this.initialized = false; // ЗАКОММЕНТИРОВАНО
      return;
    }

    // Инициализация
    if (!this.initialized) {
      // Получаем мировую позицию маркера (более надежно)
      const worldPos = new THREE.Vector3();
      src.getWorldPosition(worldPos);
      
      console.log('soft-stabilizer: инициализация, позиция маркера (local):', src.position, 'world:', worldPos);
      
      this.initialY = worldPos.y;
      this.stablePosition = new THREE.Vector3(
        worldPos.x,
        this.data.lockY ? this.initialY : worldPos.y,
        worldPos.z
      );
      this.targetPosition = this.stablePosition.clone();
      // Заполняем историю начальной позицией
      for (let i = 0; i < 5; i++) {
        this.positionHistory.push(this.stablePosition.clone());
      }
      dst.position.set(
        this.stablePosition.x,
        this.stablePosition.y,
        this.stablePosition.z
      );
      console.log('soft-stabilizer: установлена стабильная позиция:', this.stablePosition);
      this.initialized = true;
      this.lastUpdateTime = time || performance.now();
      this.el.setAttribute('visible', true);
      this.isVisible = true;
      return;
    }
    
    const currentTime = time || performance.now();
    const timeSinceUpdate = currentTime - this.lastUpdateTime;
    
    // ВСЕГДА используем стабильную позицию (не позицию маркера напрямую)
    // Это гарантирует, что модель не будет дрожать между обновлениями
    // Применяем КАЖДЫЙ КАДР, чтобы перезаписать любые изменения от MindAR
    if (this.stablePosition) {
      dst.position.set(
        this.stablePosition.x,
        this.stablePosition.y,
        this.stablePosition.z
      );
    }
    
    // Обновляем только с заданным интервалом (например, каждые 5 секунд)
    if (timeSinceUpdate >= this.data.updateInterval) {
      // Получаем мировую позицию маркера (более надежно, чем локальная)
      const worldPos = new THREE.Vector3();
      src.getWorldPosition(worldPos);
      
      const currentMarkerPos = new THREE.Vector3(
        worldPos.x,
        this.data.lockY ? this.initialY : worldPos.y,
        worldPos.z
      );
      
      // Проверяем расстояние от текущей стабильной позиции до позиции маркера
      const distance = this.stablePosition.distanceTo(currentMarkerPos);
      
      console.log(`[${Math.floor(timeSinceUpdate/1000)}s] Проверка обновления: расстояние = ${distance.toFixed(3)}, порог = ${this.data.minMoveDistance}`);
      console.log(`  Позиция маркера (world):`, currentMarkerPos);
      console.log(`  Стабильная позиция:`, this.stablePosition);
      
      // Обновляем целевую позицию ТОЛЬКО если маркер сместился достаточно сильно
      if (distance >= this.data.minMoveDistance) {
        console.log(`✓ ОБНОВЛЕНИЕ ПОЗИЦИИ: расстояние = ${distance.toFixed(3)} >= порог ${this.data.minMoveDistance}`);
        this.targetPosition.copy(currentMarkerPos);
        // Применяем сглаживание для плавного перехода
        this.stablePosition.lerp(this.targetPosition, this.data.smoothing);
        console.log(`  Новая стабильная позиция:`, this.stablePosition);
      } else {
        // Если движение недостаточно большое - не обновляем позицию
        console.log(`✗ Позиция НЕ обновлена: расстояние = ${distance.toFixed(3)} < порог ${this.data.minMoveDistance}`);
      }
      
      this.lastUpdateTime = currentTime;
    } else if (this.tickCount % 300 === 0) {
      // Логируем каждые 5 секунд (300 кадров при 60 FPS), что ждем обновления
      const remaining = (this.data.updateInterval - timeSinceUpdate) / 1000;
      const worldPos = new THREE.Vector3();
      src.getWorldPosition(worldPos);
      console.log(`Ожидание обновления: осталось ${remaining.toFixed(1)}s, текущая позиция маркера (world):`, worldPos);
    }
    
    // Блокируем ротацию
    if (this.data.lockRot) {
      dst.quaternion.set(0, 0, 0, 1);
    }

    if (markerVisible && !this.isVisible) {
      this.el.setAttribute('visible', true);
      this.isVisible = true;
    }
  }
});

// Компонент для поворота модели к камере (только по оси Y) - УЛУЧШЕННАЯ ВЕРСИЯ
AFRAME.registerComponent('look-at-camera', {
  schema: {
    enabled: { default: true },
    smoothing: { default: 0.08 },      // Уменьшено для более плавного поворота
    updateInterval: { default: 100 }  // Обновление не каждый кадр
  },
  init() {
    this.camera = null;
    this.smoothAngle = null;
    this.lastUpdateTime = 0;
    this.angleHistory = []; // История углов для медианного фильтра
  },
  tick(time) {
    if (!this.data.enabled) return;
    
    if (!this.camera) {
      this.camera = document.querySelector('a-camera');
      if (!this.camera) return;
    }

    const currentTime = time || performance.now();
    const timeSinceUpdate = currentTime - this.lastUpdateTime;
    
    // Обновляем не каждый кадр
    if (timeSinceUpdate < this.data.updateInterval) {
      return;
    }

    const cameraWorldPos = new THREE.Vector3();
    const modelWorldPos = new THREE.Vector3();
    this.camera.object3D.getWorldPosition(cameraWorldPos);
    this.el.object3D.getWorldPosition(modelWorldPos);
    
    const dx = cameraWorldPos.x - modelWorldPos.x;
    const dz = cameraWorldPos.z - modelWorldPos.z;
    const distance = Math.sqrt(dx * dx + dz * dz);
    
    if (distance < 0.001) return;
    
    const targetAngle = Math.atan2(dx, dz);
    
    // Инициализация
    if (this.smoothAngle === null) {
      this.smoothAngle = targetAngle;
      this.el.object3D.rotation.y = targetAngle;
      this.lastUpdateTime = currentTime;
      return;
    }
    
    // Медианный фильтр для углов
    this.angleHistory.push(targetAngle);
    if (this.angleHistory.length > 5) {
      this.angleHistory.shift();
    }
    
    // Нормализуем углы перед сортировкой
    const normalizedAngles = this.angleHistory.map(angle => {
      let normalized = angle - this.smoothAngle;
      while (normalized > Math.PI) normalized -= 2 * Math.PI;
      while (normalized < -Math.PI) normalized += 2 * Math.PI;
      return normalized + this.smoothAngle;
    });
    
    const sortedAngles = normalizedAngles.sort((a, b) => a - b);
    const medianAngle = sortedAngles[Math.floor(sortedAngles.length / 2)];
    
    // Вычисляем разницу от медианного угла
    let diff = medianAngle - this.smoothAngle;
    while (diff > Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    
    // Применяем очень плавное сглаживание
    this.smoothAngle += diff * this.data.smoothing;
    
    // Нормализуем угол
    while (this.smoothAngle > Math.PI) this.smoothAngle -= 2 * Math.PI;
    while (this.smoothAngle < -Math.PI) this.smoothAngle += 2 * Math.PI;
    
    this.el.object3D.rotation.set(0, this.smoothAngle, 0);
    this.lastUpdateTime = currentTime;
  }
});

// Функция создания маркера с моделями
function createMarker(index) {
  const marker = document.createElement('a-entity');
  marker.setAttribute('mindar-image-target', `targetIndex:${index}`);
  scene.appendChild(marker);

  // Контейнер моделей с сглаживанием
  const content = document.createElement('a-entity');
  content.setAttribute('position','0 0 0');
  // Стабилизация с обновлением каждые 5 секунд и большим порогом отклонения
  console.log(`Маркер ${index}: применяю soft-stabilizer к content`);
  content.setAttribute('soft-stabilizer','lockRot: true; lockY: true; minMoveDistance: 0.5; smoothing: 0.1; updateInterval: 5000');
  
  // Проверяем, что компонент применился
  setTimeout(() => {
    if (content.components && content.components['soft-stabilizer']) {
      console.log(`Маркер ${index}: soft-stabilizer успешно применен`);
    } else {
      console.error(`Маркер ${index}: ОШИБКА - soft-stabilizer НЕ применен!`);
    }
  }, 100);

  // Модель слева
  const leftWrapper = document.createElement('a-entity');
  leftWrapper.setAttribute('position','-0.5 -0.5 0');
  leftWrapper.setAttribute('visible','true');
  leftWrapper.setAttribute('rotation','0 0 0'); // Фиксированная ротация - без поворота к камере
  const leftModel = document.createElement('a-entity');
  leftModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox.glb');
  leftModel.setAttribute('scale','0.05 0.05 0.05');
  leftModel.setAttribute('rotation','0 0 0');
  leftModel.setAttribute('visible','true');
  leftModel.setAttribute('animation-mixer','clip:*; loop:repeat');
  
  // Обработчики загрузки модели
  leftModel.addEventListener('model-loaded', ()=>{
    console.log(`Маркер ${index}: левая модель (Fox) загружена`);
    leftModel.setAttribute('visible', true);
  });
  leftModel.addEventListener('model-error', (e)=>{
    console.error(`Маркер ${index}: ошибка загрузки левой модели:`, e);
  });
  
  leftWrapper.appendChild(leftModel);
  content.appendChild(leftWrapper);

  // Модель справа
  const rightWrapper = document.createElement('a-entity');
  rightWrapper.setAttribute('position','0.5 -0.5 0');
  rightWrapper.setAttribute('visible','true');
  rightWrapper.setAttribute('rotation','0 0 0'); // Фиксированная ротация - без поворота к камере
  const rightModel = document.createElement('a-entity');
  rightModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb');
  rightModel.setAttribute('scale','0.05 0.05 0.05');
  rightModel.setAttribute('rotation','0 0 0');
  rightModel.setAttribute('visible','true');
  rightModel.setAttribute('animation-mixer','clip:*; loop:repeat');
  
  // Обработчики загрузки модели
  rightModel.addEventListener('model-loaded', ()=>{
    console.log(`Маркер ${index}: правая модель (Fox1) загружена`);
    rightModel.setAttribute('visible', true);
  });
  rightModel.addEventListener('model-error', (e)=>{
    console.error(`Маркер ${index}: ошибка загрузки правой модели:`, e);
  });
  
  rightWrapper.appendChild(rightModel);
  content.appendChild(rightWrapper);

  marker.appendChild(content);
  
  // Отладка: проверяем количество дочерних элементов
  console.log(`Маркер ${index}: создано моделей в content:`, content.children.length);

  marker.addEventListener('targetFound', ()=>{
    console.log(`Маркер ${index} найден!`);
    marker.setAttribute('visible', true);
    content.setAttribute('visible', true);
    // Убеждаемся, что обе модели видны
    leftWrapper.setAttribute('visible', true);
    rightWrapper.setAttribute('visible', true);
    leftModel.setAttribute('visible', true);
    rightModel.setAttribute('visible', true);
    status.textContent = `Маркер ${index} найден`;
  });

  marker.addEventListener('targetLost', ()=>{
    marker.setAttribute('visible', false);
    content.setAttribute('visible', false);
    status.textContent = 'Наведи камеру на маркер';
  });

  return marker;
}

// Создаем маркеры
console.log(`Создаем ${markersCount} маркеров`);
for(let i=0;i<markersCount;i++){
  createMarker(i);
}
console.log(`Создано ${markersCount} маркеров`);

// Старт AR и музыки по кнопке
startBtn.addEventListener('click', async ()=>{
  startBtn.disabled = true;
  startScreen.style.display='none';
  status.style.display='block';
  try {
    // Ждём, пока сцена полностью загрузится (ИСПРАВЛЕНИЕ БАГА #1)
    if (!scene.hasLoaded) {
      await new Promise(resolve =>
        scene.addEventListener('loaded', resolve, { once:true })
      );
    }
    
    const mindar = scene.systems['mindar-image-system'];
    
    // Проверка существования mindar системы (ИСПРАВЛЕНИЕ БАГА #2)
    if (!mindar) {
      throw new Error('MindAR система не найдена. Убедитесь, что сцена загружена.');
    }
    
    await mindar.start();
    
    const music = document.getElementById('music');
    
    // Проверка существования компонента звука (ИСПРАВЛЕНИЕ БАГА #3)
    if (music && music.components && music.components.sound) {
      music.components.sound.playSound();
    } else {
      console.warn('Компонент звука не найден или еще не загружен');
    }
  } catch(e){
    alert('Камера недоступна или отказано в доступе. Обновите страницу и попробуйте снова.');
    console.error(e);
    // Восстанавливаем UI при ошибке
    startBtn.disabled = false;
    startScreen.style.display='flex';
    status.style.display='none';
  }
});
</script>

</body>
</html>
