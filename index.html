<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 6 маркеров, 2 модели</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
}
#status {
  position:fixed; bottom:12px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  color:#fff; padding:8px 12px;
  border-radius:6px; z-index:11;
  display:none;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:true"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay:false; loop:true; volume:0.5"></a-entity>

  <!-- 6 маркеров, каждая содержит 2 модели -->
  <a-entity mindar-image-target="targetIndex:0" visible="false">
    <a-entity gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
              position="-0.5 -0.5 0" scale="0.05 0.05 0.05"
              animation-mixer="clip:*; loop:repeat"></a-entity>
    <a-entity gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
              position="0.5 -0.5 0" scale="0.05 0.05 0.05"
              animation-mixer="clip:*; loop:repeat"></a-entity>
  </a-entity>

  <a-entity mindar-image-target="targetIndex:1" visible="false">
    <a-entity gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
              position="-0.5 -0.5 0" scale="0.05 0.05 0.05"
              animation-mixer="clip:*; loop:repeat"></a-entity>
    <a-entity gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
              position="0.5 -0.5 0" scale="0.05 0.05 0.05"
              animation-mixer="clip:*; loop:repeat"></a-entity>
  </a-entity>

  <a-entity mindar-image-target="targetIndex:2" visible="false">
    <a-entity gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
              position="-0.5 -0.5 0" scale="0.05 0.05 0.05"
              animation-mixer="clip:*; loop:repeat"></a-entity>
    <a-entity gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
              position="0.5 -0.5 0" scale="0.05 0.05 0.05"
              animation-mixer="clip:*; loop:repeat"></a-entity>
  </a-entity>

  <a-entity mindar-image-target="targetIndex:3" visible="false">
    <a-entity gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
              position="-0.5 -0.5 0" scale="0.05 0.05 0.05"
              animation-mixer="clip:*; loop:repeat"></a-entity>
    <a-entity gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
              position="0.5 -0.5 0" scale="0.05 0.05 0.05"
              animation-mixer="clip:*; loop:repeat"></a-entity>
  </a-entity>

  <a-entity mindar-image-target="targetIndex:4" visible="false">
    <a-entity gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
              position="-0.5 -0.5 0" scale="0.05 0.05 0.05"
              animation-mixer="clip:*; loop:repeat"></a-entity>
    <a-entity gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
              position="0.5 -0.5 0" scale="0.05 0.05 0.05"
              animation-mixer="clip:*; loop:repeat"></a-entity>
  </a-entity>

  <a-entity mindar-image-target="targetIndex:5" visible="false">
    <a-entity gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
              position="-0.5 -0.5 0" scale="0.05 0.05 0.05"
              animation-mixer="clip:*; loop:repeat"></a-entity>
    <a-entity gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
              position="0.5 -0.5 0" scale="0.05 0.05 0.05"
              animation-mixer="clip:*; loop:repeat"></a-entity>
  </a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');
const music = document.getElementById('music');

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startScreen.style.display = 'none';
  status.style.display = 'block';

  const scene = document.querySelector('a-scene');
  const mindar = scene.systems['mindar-image-system'];

  try {
    await mindar.start();

    if(music.components.sound) music.components.sound.playSound();

    // Управление видимостью моделей и статусом
    const markers = document.querySelectorAll('[mindar-image-target]');
    markers.forEach(marker => {
      const models = marker.children; // все модели внутри маркера
      for(let i=0; i<models.length; i++) models[i].setAttribute('visible', false);

      marker.addEventListener('targetFound', () => {
        for(let i=0; i<models.length; i++) models[i].setAttribute('visible', true);
        status.textContent = 'Маркер найден';
      });

      marker.addEventListener('targetLost', () => {
        for(let i=0; i<models.length; i++) models[i].setAttribute('visible', false);
        status.textContent = 'Наведи камеру на маркер';
      });
    });

  } catch(e) {
    alert('Камера недоступна или отказано в доступе. Обновите страницу и попробуйте снова.');
    console.error(e);
  }
});
</script>

</body>
</html>
