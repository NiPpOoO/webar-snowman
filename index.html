<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>WebAR: Несколько маркеров снеговика</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <!-- AR.js (NFT) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    /* Статусы и кнопка */
    #status {
      position: absolute; top: 10px; right: 10px;
      padding: 8px 12px; background: rgba(0,0,0,0.6);
      color: #fff; border-radius: 6px; font-size: 14px; z-index: 3;
    }
    #switchBtn {
      position: absolute; top: 50px; right: 10px;
      padding: 8px 12px; background: rgba(0,0,0,0.6);
      color: #fff; border-radius: 6px; font-size: 14px; cursor: pointer; z-index: 3;
    }

    /* Анти‑зум: рендерим видео без кропа, canvas поверх */
    #arjs-video, video[playsinline] {
      position: fixed; left: 0; top: 0;
      width: 100vw; height: 100vh;
      object-fit: contain; /* важно: не кропить, а вписывать */
      z-index: 1; background: #000;
    }
    canvas.a-canvas {
      position: fixed !important;
      left: 0; top: 0; width: 100vw !important; height: 100vh !important;
      z-index: 2; pointer-events: none;
    }

    /* Лоадер */
    .arjs-loader { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; z-index: 4; }
    .arjs-loader > div { background: rgba(0,0,0,0.6); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; }
  </style>
</head>
<body style="margin:0; overflow:hidden;">
  <div class="arjs-loader"><div>Загрузка маркеров, подождите…</div></div>

  <div id="status">Маркер не виден</div>
  <button id="switchBtn">Сменить модель</button>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; facingMode: environment; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;"
  >
    <!-- Маркеры -->
    <a-nft id="snowman" type="nft"
      url="https://nippooo.github.io/webar-snowman/assets/markers/snowman/snowman"
      emitevents="true">
      <a-entity id="model-snowman"
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
        scale="0.3 0.3 0.3" position="0 0 0" visible="false"></a-entity>
    </a-nft>

    <a-nft id="snowman1" type="nft"
      url="https://nippooo.github.io/webar-snowman/assets/markers/snowman1/snowman1"
      emitevents="true">
      <a-entity id="model-snowman1"
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
        scale="0.3 0.3 0.3" position="0 0 0" visible="false"></a-entity>
    </a-nft>

    <a-nft id="snowman2" type="nft"
      url="https://nippooo.github.io/webar-snowman/assets/markers/snowman2/snowman2"
      emitevents="true">
      <a-entity id="model-snowman2"
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
        scale="0.3 0.3 0.3" position="0 0 0" visible="false"></a-entity>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById('status');
    const switchBtn = document.getElementById('switchBtn');

    const models = [
      "https://nippooo.github.io/webar-snowman/assets/models/Fox.glb",
      "https://nippooo.github.io/webar-snowman/assets/models/Penguin.glb",
      "https://nippooo.github.io/webar-snowman/assets/models/Bear.glb"
    ];
    let currentIndex = 0;

    function setupMarker(markerId, modelId, markerName) {
      const marker = document.getElementById(markerId);
      const modelEntity = document.getElementById(modelId);

      marker.addEventListener('markerFound', () => {
        status.textContent = `${markerName} виден`;
        modelEntity.setAttribute('visible', true);
      });

      marker.addEventListener('markerLost', () => {
        status.textContent = `${markerName} не виден`;
      });

      switchBtn.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % models.length;
        modelEntity.setAttribute('gltf-model', models[currentIndex]);
      });
    }

    setupMarker('snowman', 'model-snowman', 'Снеговик');
    setupMarker('snowman1', 'model-snowman1', 'Снеговик1');
    setupMarker('snowman2', 'model-snowman2', 'Снеговик2');

    // Безопасное получение arSource (AR.js источник) после инициализации сцены
    async function waitForArSource(sceneEl, maxTries = 40, delayMs = 100) {
      for (let i = 0; i < maxTries; i++) {
        const arSystem = sceneEl.systems && sceneEl.systems['arjs'];
        const arSource = arSystem && arSystem.arSource;
        if (arSource && arSource.domElement) return arSource;
        await new Promise(r => setTimeout(r, delayMs));
      }
      return null;
    }

    // Инициализация камеры без OverconstrainedError и визуального «зума»
    async function initCamera() {
      const sceneEl = document.querySelector('a-scene');
      const arSource = await waitForArSource(sceneEl);
      if (!arSource) {
        console.error('AR.js источник не найден.');
        status.textContent = 'AR.js источник не найден';
        return;
      }

      try {
        // Совместимый запрос: environment для мобилок, true для ПК как fallback
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        let stream = await navigator.mediaDevices.getUserMedia({
          video: isMobile ? { facingMode: "environment" } : true
        });

        // После разрешения — подменяем поток
        const prevStream = arSource.domElement.srcObject;
        if (prevStream && prevStream.getTracks) prevStream.getTracks().forEach(t => t.stop());

        // Анти‑зум атрибуты видео
        arSource.domElement.setAttribute('id', 'arjs-video');
        arSource.domElement.setAttribute('playsinline', true);
        arSource.domElement.muted = true;
        arSource.domElement.autoplay = true;

        arSource.domElement.srcObject = stream;
        await arSource.domElement.play().catch(() => {});

        // Синхронизация размеров
        arSource.ready = true;
        arSource.onResizeElement();
        arSource.copyElementSizeTo(sceneEl.canvas);

        // Логи реальных параметров
        const track = stream.getVideoTracks()[0];
        const settings = track.getSettings ? track.getSettings() : {};
        console.log('📷 Камера активна:', settings);
        status.textContent = `Камера: ${settings.width || '?'}×${settings.height || '?'}`;

        // Скрываем лоадер
        const loader = document.querySelector('.arjs-loader');
        if (loader) loader.style.display = 'none';
      } catch (err) {
        console.error('❌ Ошибка камеры:', err);
        status.textContent = `Ошибка камеры: ${err.name}`;

        // Дополнительный fallback для десктопа: пробуем без параметров
        try {
          const streamFallback = await navigator.mediaDevices.getUserMedia({ video: true });
          arSource.domElement.srcObject = streamFallback;
          arSource.ready = true;
          arSource.onResizeElement();
          arSource.copyElementSizeTo(sceneEl.canvas);
          const s = streamFallback.getVideoTracks()[0].getSettings();
          status.textContent = `Камера (fallback): ${s.width || '?'}×${s.height || '?'}`;
          const loader = document.querySelector('.arjs-loader');
          if (loader) loader.style.display = 'none';
        } catch (err2) {
          console.error('❌ Fallback тоже не удалось:', err2);
        }
      }
    }

    // Ждём готовности сцены и только затем инициируем камеру
    const sceneEl = document.querySelector('a-scene');
    if (sceneEl.hasLoaded) {
      initCamera();
    } else {
      sceneEl.addEventListener('loaded', initCamera);
    }
  </script>
</body>
</html>
