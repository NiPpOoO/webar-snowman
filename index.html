<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 42</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
#start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; z-index:10; }
#start button { padding:16px 26px; font-size:16px; border-radius:10px; border:none; }
#status { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.65); color:#fff; padding:8px 12px; border-radius:6px; font-size:14px; z-index:11; display:none; }
a-scene { position:fixed !important; inset:0; background:transparent !important; }
video#camera { position:fixed; top:0; left:0; width:100vw; height:100vh; object-fit:cover; z-index:0; }
</style>
</head>
<body>

<!-- Start button -->
<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>

<div id="status">Наведи камеру на маркер</div>

<!-- AR Scene -->
<a-scene id="scene"
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false"
  vr-mode-ui="enabled:false"
>
  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Target with cube -->
  <a-entity id="target" mindar-image-target="targetIndex:0">
    <a-box position="0 0 0" width="0.25" height="0.25" depth="0.25" color="#ff0000"></a-box>
  </a-entity>
</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');
const scene = document.getElementById('scene');
const target = document.getElementById('target');

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startScreen.style.display = 'none';
  status.style.display = 'block';

  // Создаём video элемент для Safari iOS
  let video = document.getElementById('camera');
  if(!video) {
    video = document.createElement('video');
    video.id = 'camera';
    video.setAttribute('autoplay', '');
    video.setAttribute('muted', '');
    video.setAttribute('playsinline', '');
    document.body.appendChild(video);
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    await video.play();

    const mindarSystem = scene.systems['mindar-image-system'];
    await mindarSystem.start({ video: video }); // Передаём видео для Safari
    console.log('MindAR запущен');

  } catch(e) {
    alert('Камера недоступна или отказано в доступе. Попробуй обновить страницу и нажать кнопку ещё раз.');
    console.error(e);
  }
});

// UI feedback
target.addEventListener('targetFound', () => status.textContent = 'Маркер найден');
target.addEventListener('targetLost', () => status.textContent = 'Наведи камеру на маркер');
</script>

</body>
</html>
