<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>41</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:#000;}
#start button{padding:16px 26px;font-size:16px;border-radius:10px;border:none;}
#status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:8px 12px;border-radius:6px;font-size:14px;z-index:11;display:none;}
a-scene{position:fixed !important;inset:0;background:transparent !important;}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>

<div id="status">Наведи камеру на маркер</div>

<a-scene
  id="scene"
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false; embedded:true;"
  vr-mode-ui="enabled:false"
  embedded
>
  <a-camera look-controls="enabled:false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex:0">
    <a-box position="0 0 0" width="0.25" height="0.25" depth="0.25" color="#ff0000"></a-box>
  </a-entity>
</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');
const scene = document.getElementById('scene');
const target = document.getElementById('target');

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startScreen.style.display = 'none';
  status.style.display = 'block';

  // 1️⃣ Создаем video вручную для iOS
  const video = document.createElement('video');
  video.setAttribute('autoplay','');
  video.setAttribute('muted','');
  video.setAttribute('playsinline','');
  video.style.position='fixed';
  video.style.top='0';
  video.style.left='0';
  video.style.width='100vw';
  video.style.height='100vh';
  video.style.objectFit='cover';
  video.style.zIndex='0';
  document.body.appendChild(video);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment' } });
    video.srcObject = stream;
    await video.play();

    // 2️⃣ Передаем этот video в MindAR
    const mindarSystem = scene.systems['mindar-image-system'];
    mindarSystem.videoEl = video;

    await mindarSystem.start();
    console.log('MindAR запущен на iOS и Android');
  } catch(e) {
    alert('Ошибка запуска камеры. Safari может требовать обновление страницы и повторный клик.');
    console.error(e);
  }
});

target.addEventListener('targetFound', () => { status.textContent='Маркер найден'; });
target.addEventListener('targetLost', () => { status.textContent='Наведи камеру на маркер'; });
</script>

</body>
</html>
