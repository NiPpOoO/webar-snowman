<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 1Статичные модели + камера</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>
html,body{
  margin:0; width:100%; height:100%; overflow:hidden;
}
#start{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:10; background:#000;
}
#start button{
  padding:16px 28px; font-size:16px; border-radius:12px; border:none;
}
</style>
</head>

<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>

<a-scene embedded
         vr-mode-ui="enabled:false"
         renderer="alpha:true"
         arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- Камера AR.js -->
  <a-entity camera look-controls="enabled:false">

    <!-- HUD контейнер: статичные модели -->
    <a-entity id="hud" position="0 0 -2">

      <!-- Левая модель -->
      <a-entity
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
        position="-0.6 -0.4 0"
        scale="0.05 0.05 0.05"
        animation-mixer>
      </a-entity>

      <!-- Правая модель -->
      <a-entity
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
        position="0.6 -0.4 0"
        scale="0.05 0.05 0.05"
        animation-mixer>
      </a-entity>

    </a-entity>

  </a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const hud = document.getElementById('hud');

startBtn.onclick = () => {
  startBtn.disabled = true;
  startScreen.style.display='none';

  // Задержка появления моделей 5 секунд
  setTimeout(()=>{
    hud.setAttribute('visible','true');
  },5000);
};
</script>

</body>
</html>
