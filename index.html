<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 1Fixed Copy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:true;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Маркер с временными моделями -->
  <a-entity id="marker" mindar-image-target="targetIndex:0">
    <a-entity id="tempFox" gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
              scale="0.05 0.05 0.05"
              visible="false"
              animation-mixer="clip:*; loop:repeat">
    </a-entity>
  </a-entity>

  <!-- Независимая копия вне маркера -->
  <a-entity id="fixedFox" gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
            scale="0.05 0.05 0.05"
            visible="false"
            animation-mixer="clip:*; loop:repeat">
  </a-entity>

</a-scene>

<script>
const marker = document.getElementById('marker');
const tempFox = document.getElementById('tempFox');
const fixedFox = document.getElementById('fixedFox');

marker.addEventListener('targetFound', () => {
  // показать временную модель внутри маркера
  tempFox.setAttribute('visible', true);

  // получить мировые координаты
  const worldPos = new THREE.Vector3();
  const worldQuat = new THREE.Quaternion();
  tempFox.object3D.getWorldPosition(worldPos);
  tempFox.object3D.getWorldQuaternion(worldQuat);

  // перенести в независимую копию
  fixedFox.object3D.position.copy(worldPos);
  fixedFox.object3D.quaternion.copy(worldQuat);

  fixedFox.setAttribute('visible', true);

  // скрыть временную модель внутри маркера
  tempFox.setAttribute('visible', false);
});

marker.addEventListener('targetLost', () => {
  // НЕ скрываем — копия остаётся навсегда
});
</script>

</body>
</html>
