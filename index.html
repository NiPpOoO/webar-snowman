<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — Always On Screen</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
</style>
</head>

<body>

<a-scene
  vr-mode-ui="enabled:false"
  renderer="alpha:true"
  embedded>

  <!-- КАМЕРА -->
  <a-camera look-controls="enabled:false">

    <!-- 🔥 HUD-КОНТЕЙНЕР (ВСЕГДА В КАДРЕ) -->
    <a-entity position="0 0 -2">

      <!-- Левая модель -->
      <a-entity
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
        position="-0.6 -0.4 0"
        scale="0.05 0.05 0.05"
        animation-mixer>
      </a-entity>

      <!-- Правая модель -->
      <a-entity
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
        position="0.6 -0.4 0"
        scale="0.05 0.05 0.05"
        animation-mixer>
      </a-entity>

    </a-entity>

  </a-camera>

</a-scene>

</body>
</html>
