<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MindAR — 1DIAGNOSTIC</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
#start {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
#start button {
  padding: 16px 26px;
  font-size: 16px;
}
#status {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.6);
  color: #fff;
  padding: 6px 10px;
  border-radius: 6px;
  display: none;
  z-index: 11;
}
</style>
</head>

<body>

<div id="start">
  <button id="startBtn">START AR</button>
</div>
<div id="status">Waiting...</div>

<a-scene
  mindar-image="imageTargetSrc: https://mind-ar-js.github.io/Examples/image-tracking/assets/card-example/card.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:true"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex:0">
    <!-- НЕЛЬЗЯ НЕ УВИДЕТЬ -->
    <a-box
      color="red"
      depth="0.2"
      height="0.2"
      width="0.2"
      position="0 0 0.1">
    </a-box>
  </a-entity>

</a-scene>

<script>
const scene = document.querySelector('a-scene');
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startScreen.style.display = 'none';
  status.style.display = 'block';
  status.textContent = 'Starting AR...';

  try {
    await scene.systems['mindar-image-system'].start();
    status.textContent = 'Point at MindAR card';
  } catch (e) {
    status.textContent = 'FAILED TO START';
    console.error(e);
  }
});
</script>

</body>
</html>
