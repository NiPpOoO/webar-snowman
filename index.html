<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 4Статичные модели</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://unpkg.com/aframe@1.4.2/dist/aframe-master.min.js"></script>
<script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
  cursor:pointer;
  background:#fff;
  color:#000;
}
#start button:active {
  opacity:0.8;
}
#start button:disabled {
  opacity:0.6;
  cursor:not-allowed;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить</button>
</div>

<a-scene
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true; antialias:true;">

  <a-camera look-controls="enabled:false" position="0 0 0"></a-camera>

  <!-- Видеоплоскость с камерой (фон) -->
  <a-plane id="videoPlane" 
           position="0 0 -1.5" 
           width="2" 
           height="2" 
           rotation="0 0 0"
           visible="false"
           material="shader: flat; side: double;"></a-plane>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay: false; loop: true; volume: 0.5"></a-entity>

  <!-- Контейнер для статичных моделей -->
  <a-entity id="modelsContainer" position="0 0 -1" visible="false">

    <!-- Модель слева -->
    <a-entity
      id="leftModel"
      gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
      position="-0.3 -0.3 0"
      scale="0.05 0.05 0.05"
      visible="true"
      animation-mixer="clip:*; loop:repeat">
    </a-entity>

    <!-- Модель справа -->
    <a-entity
      id="rightModel"
      gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
      position="0.3 -0.3 0"
      scale="0.05 0.05 0.05"
      visible="true"
      animation-mixer="clip:*; loop:repeat">
    </a-entity>

  </a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const modelsContainer = document.getElementById('modelsContainer');
const music = document.getElementById('music');
const videoPlane = document.getElementById('videoPlane');
let videoStream = null;
let videoElement = null;

async function startCamera() {
  try {
    // Запрашиваем доступ к камере
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: 'environment', // Задняя камера на мобильных
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      } 
    });
    
    videoStream = stream;
    
    // Создаем video элемент
    const video = document.createElement('video');
    video.srcObject = stream;
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.style.display = 'none';
    video.style.position = 'absolute';
    video.style.width = '1px';
    video.style.height = '1px';
    document.body.appendChild(video);
    videoElement = video;
    
    // Ждем пока видео начнет воспроизводиться и получим его размеры
    await new Promise((resolve) => {
      video.onloadedmetadata = () => {
        video.play().then(() => {
          resolve();
        }).catch(() => {
          video.muted = true;
          video.play().then(resolve).catch(() => resolve());
        });
      };
    });
    
    // Получаем реальные размеры видео
    const videoWidth = video.videoWidth || 1920;
    const videoHeight = video.videoHeight || 1080;
    const aspectRatio = videoWidth / videoHeight;
    
    // Вычисляем размеры плоскости с учетом aspect ratio
    // Используем FOV камеры для правильного масштабирования
    const camera = document.querySelector('a-camera').getObject3D('camera');
    const fov = camera ? camera.fov : 80;
    const distance = 1.5; // Расстояние от камеры
    const heightAtDistance = 2 * Math.tan((fov * Math.PI / 180) / 2) * distance;
    const widthAtDistance = heightAtDistance * aspectRatio;
    
    // Устанавливаем правильные размеры плоскости
    // Ограничиваем максимальный размер для предотвращения увеличения
    const maxWidth = 3;
    const maxHeight = 3;
    const finalWidth = Math.min(widthAtDistance, maxWidth);
    const finalHeight = Math.min(heightAtDistance, maxHeight);
    
    videoPlane.setAttribute('width', finalWidth);
    videoPlane.setAttribute('height', finalHeight);
    
    // Применяем видео к плоскости через Three.js
    const applyVideoTexture = () => {
      const mesh = videoPlane.getObject3D('mesh');
      if (mesh && mesh.material) {
        const THREE = AFRAME.THREE;
        const videoTexture = new THREE.VideoTexture(video);
        videoTexture.format = THREE.RGBAFormat;
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        
        // Зеркалим текстуру через UV координаты
        const geometry = mesh.geometry;
        if (geometry && geometry.attributes && geometry.attributes.uv) {
          const uvs = geometry.attributes.uv.array;
          // Зеркалим по оси U (горизонтально)
          for (let i = 0; i < uvs.length; i += 2) {
            uvs[i] = 1.0 - uvs[i];
          }
          geometry.attributes.uv.needsUpdate = true;
        }
        
        // Обновляем текстуру каждый кадр
        videoTexture.needsUpdate = true;
        
        mesh.material.map = videoTexture;
        mesh.material.needsUpdate = true;
        
        // Обновляем текстуру в каждом кадре
        const updateTexture = () => {
          if (videoTexture && video.readyState >= 2) {
            videoTexture.needsUpdate = true;
          }
          requestAnimationFrame(updateTexture);
        };
        updateTexture();
      } else {
        setTimeout(applyVideoTexture, 100);
      }
    };
    
    // Пробуем применить сразу или после загрузки
    if (videoPlane.hasLoaded) {
      applyVideoTexture();
    } else {
      videoPlane.addEventListener('loaded', applyVideoTexture);
    }
    
    // Показываем видеоплоскость
    videoPlane.setAttribute('visible', true);
    
    return true;
  } catch(error) {
    console.error('Ошибка доступа к камере:', error);
    alert('Не удалось получить доступ к камере. Разрешите доступ к камере в настройках браузера.');
    return false;
  }
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = 'Загрузка...';
  
  // Запускаем камеру
  const cameraStarted = await startCamera();
  
  if (!cameraStarted) {
    startBtn.disabled = false;
    startBtn.textContent = 'Запустить';
    return;
  }
  
  startScreen.style.display = 'none';

  // Запускаем музыку
  if (music && music.components && music.components.sound) {
    music.components.sound.playSound();
  }

  // Появление моделей через 5 секунд
  setTimeout(() => {
    console.log('Показываем модели');
    const container = document.getElementById('modelsContainer');
    const leftModel = document.getElementById('leftModel');
    const rightModel = document.getElementById('rightModel');
    
    if (container) {
      // Убеждаемся, что контейнер видим
      container.setAttribute('visible', true);
      
      // Принудительно обновляем видимость через объект3D
      const containerObj = container.object3D;
      if (containerObj) {
        containerObj.visible = true;
        containerObj.traverse((child) => {
          if (child.isMesh || child.isGroup) {
            child.visible = true;
            console.log('Дочерний элемент сделан видимым:', child);
          }
        });
      }
      
      // Проверяем модели отдельно
      if (leftModel) {
        leftModel.setAttribute('visible', true);
        const leftObj = leftModel.object3D;
        if (leftObj) {
          leftObj.visible = true;
          leftObj.traverse((child) => {
            if (child.isMesh || child.isGroup) {
              child.visible = true;
            }
          });
        }
        console.log('Левая модель должна быть видна');
      }
      
      if (rightModel) {
        rightModel.setAttribute('visible', true);
        const rightObj = rightModel.object3D;
        if (rightObj) {
          rightObj.visible = true;
          rightObj.traverse((child) => {
            if (child.isMesh || child.isGroup) {
              child.visible = true;
            }
          });
        }
        console.log('Правая модель должна быть видна');
      }
      
      // Проверяем загрузку моделей
      const models = container.querySelectorAll('[gltf-model]');
      console.log(`Найдено моделей: ${models.length}`);
      models.forEach((model, index) => {
        model.addEventListener('model-loaded', () => {
          console.log(`Модель ${index + 1} загружена`);
          const obj = model.object3D;
          if (obj) {
            obj.visible = true;
            obj.traverse((child) => {
              if (child.isMesh || child.isGroup) {
                child.visible = true;
              }
            });
          }
        });
        model.addEventListener('model-error', (e) => {
          console.error(`Ошибка загрузки модели ${index + 1}:`, e);
        });
      });
      
      console.log('Модели должны быть видны');
    } else {
      console.error('modelsContainer не найден');
    }
  }, 5000);
});

// Очистка при закрытии страницы
window.addEventListener('beforeunload', () => {
  if (videoStream) {
    videoStream.getTracks().forEach(track => track.stop());
  }
  if (videoElement && videoElement.parentNode) {
    videoElement.parentNode.removeChild(videoElement);
  }
});
</script>

</body>
</html>
