<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MindAR Stable</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

<!-- MindAR CORE -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>

<!-- MindAR A-Frame -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind"
  embedded
  vr-mode-ui="enabled:false"
>
  <a-camera look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex:0">
    <a-box position="0 0 0" scale="0.3 0.3 0.3" color="orange"></a-box>
  </a-entity>
</a-scene>

</body>
</html>
