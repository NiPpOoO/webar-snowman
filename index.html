<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 88</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
#start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:10; background:#000; }
#start button { padding:16px 26px; font-size:16px; border-radius:10px; border:none; }
#status { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); background: rgba(0,0,0,0.65); color:#fff; padding:8px 12px; border-radius:6px; font-size:14px; z-index:11; display:none; }
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');

startBtn.addEventListener('click', () => {
  startBtn.disabled = true;
  startScreen.style.display = 'none';
  status.style.display = 'block';

  const scene = document.createElement('a-scene');
  scene.setAttribute('mindar-image', 'imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;');
  scene.setAttribute('vr-mode-ui', 'enabled:false');
  scene.setAttribute('renderer', 'alpha:true');
  document.body.appendChild(scene);

  const camera = document.createElement('a-camera');
  camera.setAttribute('look-controls', 'enabled:false');
  scene.appendChild(camera);

  const target = document.createElement('a-entity');
  target.setAttribute('mindar-image-target', 'targetIndex:0');

  const wrapper = document.createElement('a-entity');
  wrapper.setAttribute('id','wrapper');
  wrapper.setAttribute('position','-0.3 -0.3 0');
  wrapper.setAttribute('rotation','0 0 0');

  const model = document.createElement('a-entity');
  model.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox.glb');
  model.setAttribute('scale','0.3 0.3 0.3');
  wrapper.appendChild(model);
  target.appendChild(wrapper);
  scene.appendChild(target);

  let mixer = null;

  model.addEventListener('model-loaded', (e) => {
    const mesh = e.detail.model;
    const gltf = mesh.el.getObject3D('mesh').gltf; // получаем gltf с анимациями

    if(!gltf || !gltf.animations || gltf.animations.length === 0){
      status.textContent = '❌ Анимации не найдено';
      return;
    }

    mixer = new THREE.AnimationMixer(mesh.object3D);
    gltf.animations.forEach((clip) => {
      const action = mixer.clipAction(clip);
      action.setLoop(THREE.LoopRepeat);
      action.play();
    });

    status.textContent = '▶️ Анимация запущена: ' + gltf.animations.map(a => a.name).join(', ');
  });

  // Сглаживание позиции/ротации
  const prevPos = new THREE.Vector3();
  const prevRot = new THREE.Euler();

  scene.addEventListener('tick', (ev) => {
    if(mixer) mixer.update(ev.detail.delta / 1000);

    const obj = wrapper.object3D;
    if(obj){
      obj.position.lerp(prevPos.set(obj.position.x,obj.position.y,obj.position.z), 0.2);
      obj.rotation.set(
        THREE.MathUtils.lerp(prevRot.x,obj.rotation.x,0.2),
        THREE.MathUtils.lerp(prevRot.y,obj.rotation.y,0.2),
        THREE.MathUtils.lerp(prevRot.z,obj.rotation.z,0.2)
      );
      prevPos.copy(obj.position);
      prevRot.copy(obj.rotation);
    }
  });

  scene.addEventListener('loaded', async () => {
    const mindarSystem = scene.systems['mindar-image-system'];
    if(!mindarSystem){ alert('MindAR не загружен!'); return; }
    try {
      await mindarSystem.start();
      console.log('MindAR запущен');
      target.addEventListener('targetFound', ()=> status.textContent='Маркер найден');
      target.addEventListener('targetLost', ()=> status.textContent='Наведи камеру на маркер');
    } catch(e){
      alert('Камера недоступна или отказано в доступе. Обновите страницу и попробуйте снова.');
      console.error(e);
    }
  });
});
</script>

</body>
</html>
