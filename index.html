<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 103</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
}
#start {
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
  background:#000;
}
#start button {
  padding:16px 26px;
  font-size:16px;
  border-radius:10px;
  border:none;
}
#status {
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  background: rgba(0,0,0,0.65);
  color:#fff;
  padding:8px 12px;
  border-radius:6px;
  font-size:14px;
  z-index:11;
  display:none;
}
</style>
</head>

<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');

startBtn.addEventListener('click', () => {
  startBtn.disabled = true;
  startScreen.style.display = 'none';
  status.style.display = 'block';

  // Сцена
  const scene = document.createElement('a-scene');
  scene.setAttribute(
    'mindar-image',
    'imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;'
  );
  scene.setAttribute('vr-mode-ui', 'enabled:false');
  scene.setAttribute('renderer', 'alpha:true');
  document.body.appendChild(scene);

  // Камера
  const camera = document.createElement('a-camera');
  camera.setAttribute('look-controls', 'enabled:false');
  scene.appendChild(camera);

  // Target
  const target = document.createElement('a-entity');
  target.setAttribute('mindar-image-target', 'targetIndex:0');

  // Wrapper
  const wrapper = document.createElement('a-entity');
  wrapper.setAttribute('position', '-0.3 -0.3 0');
  wrapper.setAttribute('rotation', '0 0 0');

  // Модель
  const model = document.createElement('a-entity');
  model.setAttribute(
    'gltf-model',
    'https://nippooo.github.io/webar-snowman/assets/models/Fox.glb'
  );
  model.setAttribute('scale', '0.3 0.3 0.3');

  wrapper.appendChild(model);
  target.appendChild(wrapper);
  scene.appendChild(target);

  let mixer = null;

  // ✅ ЕДИНСТВЕННО ПРАВИЛЬНОЕ МЕСТО ДЛЯ АНИМАЦИЙ
  model.addEventListener('model-loaded', (e) => {
    const gltfRoot = e.detail.model;
    const animations = gltfRoot.animations;

    console.log('GLTF root:', gltfRoot);
    console.log('Animations:', animations);

    if (!animations || animations.length === 0) {
      status.textContent = '❌ Анимации не найдены';
      return;
    }

    mixer = new THREE.AnimationMixer(gltfRoot);

    animations.forEach((clip) => {
      const action = mixer.clipAction(clip);
      action.reset();
      action.setLoop(THREE.LoopRepeat);
      action.play();
    });

    status.textContent =
      '▶️ Анимации запущены: ' + animations.map(a => a.name).join(', ');
  });

  // Tick
  scene.addEventListener('tick', (ev) => {
    if (mixer) {
      mixer.update(ev.detail.delta / 1000);
    }
  });

  // MindAR start
  scene.addEventListener('loaded', async () => {
    const mindarSystem = scene.systems['mindar-image-system'];
    if (!mindarSystem) {
      alert('MindAR не загружен');
      return;
    }

    try {
      await mindarSystem.start();
      console.log('MindAR запущен');

      target.addEventListener('targetFound', () => {
        status.textContent = 'Маркер найден';
      });

      target.addEventListener('targetLost', () => {
        status.textContent = 'Наведи камеру на маркер';
      });

    } catch (e) {
      alert('Нет доступа к камере');
      console.error(e);
    }
  });
});
</script>

</body>
</html>
