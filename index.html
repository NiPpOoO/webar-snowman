<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 54</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#start {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  background: #000;
}

#start button {
  padding: 16px 26px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
}

#status {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.65);
  color: #fff;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 14px;
  z-index: 11;
  display: none;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>

<div id="status">Наведи камеру на маркер</div>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');

startBtn.addEventListener('click', async () => {
  startScreen.style.display = 'none';
  status.style.display = 'block';

  // Создаем <a-scene> динамически
  const scene = document.createElement('a-scene');
  scene.setAttribute('mindar-image', 'imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false');
  scene.setAttribute('vr-mode-ui', 'enabled:false');
  scene.setAttribute('renderer', 'alpha:true');

  // Камера
  const camera = document.createElement('a-camera');
  camera.setAttribute('look-controls', 'enabled:false');
  scene.appendChild(camera);

  // Target
  const target = document.createElement('a-entity');
  target.setAttribute('mindar-image-target', 'targetIndex:0');

  // Куб для теста
  const box = document.createElement('a-box');
  box.setAttribute('position', '0 0 0');
  box.setAttribute('width', '0.25');
  box.setAttribute('height', '0.25');
  box.setAttribute('depth', '0.25');
  box.setAttribute('color', '#ff0000');
  target.appendChild(box);

  scene.appendChild(target);
  document.body.appendChild(scene);

  // Ждем, пока сцена и системы полностью инициализируются
  scene.addEventListener('loaded', async () => {
    const mindarSystem = scene.systems['mindar-image-system'];
    if(!mindarSystem) {
      alert('MindAR не загружен!');
      return;
    }

    try {
      await mindarSystem.start();
      console.log('MindAR запущен');

      // События для статуса
      target.addEventListener('targetFound', () => { status.textContent = 'Маркер найден'; });
      target.addEventListener('targetLost', () => { status.textContent = 'Наведи камеру на маркер'; });

    } catch(e) {
      alert('Ошибка запуска камеры. Обновите страницу и попробуйте снова.');
      console.error(e);
    }
  });
});
</script>

</body>
</html>
