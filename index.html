<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 8111</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://unpkg.com/aframe@1.4.2/dist/aframe-master.min.js"></script>
<script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR -->
<script src="https://unpkg.com/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://unpkg.com/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
}
#status {
  position:fixed; bottom:12px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  color:#fff; padding:8px 12px;
  border-radius:6px; z-index:11;
  display:none;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay: false; loop: true; volume: 0.5"></a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');
const scene = document.querySelector('a-scene');

const markersCount = 14;

// Компонент для стабилизации моделей с расширенными методами
AFRAME.registerComponent('model-stabilizer', {
  schema: {
    smoothing: { default: 0.05 },
    updateInterval: { default: 300 },
    minMoveDistance: { default: 0.15 },
    freezeAfterInit: { default: true },
    useEMA: { default: true },           // Использовать экспоненциальное скользящее среднее
    useVelocityFilter: { default: true }, // Фильтрация по скорости движения
    lockScale: { default: true },        // Блокировать масштаб
    adaptiveFiltering: { default: true } // Адаптивная фильтрация
  },
  init() {
    this.initialized = false;
    this.positionFrozen = false;
    this.stablePosition = null;
    this.targetPosition = null;
    this.positionHistory = [];
    this.lastUpdateTime = 0;
    this.frozenWorldMatrix = null;
    this.frozenScale = null;
    this.velocity = new THREE.Vector3(0, 0, 0);
    this.lastPosition = new THREE.Vector3(0, 0, 0);
    this.emaAlpha = 0.1; // Коэффициент для EMA (меньше = более плавно)
  },
  tick(time) {
    const dst = this.el.object3D;
    const parent = this.el.parentEl;
    
    if (!parent || !parent.object3D) return;
    
    const src = parent.object3D;
    const currentTime = time || performance.now();
    const timeSinceUpdate = currentTime - this.lastUpdateTime;
    
    // Если позиция заморожена - ПРИНУДИТЕЛЬНО фиксируем локальную позицию каждый кадр
    if (this.positionFrozen) {
      // Блокируем ВСЕ автоматические обновления
      dst.matrixAutoUpdate = false;
      dst.matrixWorldNeedsUpdate = false;
      
      // ПРИНУДИТЕЛЬНО устанавливаем локальную позицию на 0,0,0 относительно маркера
      // Это гарантирует, что модель всегда находится в центре маркера
      dst.position.set(0, 0, 0);
      
      // Блокируем ротацию
      dst.quaternion.set(0, 0, 0, 1);
      
      // Блокируем масштаб, если включено
      if (this.data.lockScale && this.frozenScale) {
        dst.scale.copy(this.frozenScale);
      } else {
        dst.scale.set(1, 1, 1);
      }
      
      // Обновляем локальную матрицу
      dst.updateMatrix();
      
      // Если есть замороженная мировая матрица - используем её
      // Но обычно лучше позволить мировой матрице обновляться от родителя (маркера)
      // чтобы модель двигалась вместе с маркером, но оставалась в его центре
      if (this.frozenWorldMatrix) {
        // Можно использовать замороженную мировую матрицу для полной фиксации
        // dst.matrixWorld.copy(this.frozenWorldMatrix);
        // Или позволить мировой матрице обновляться от родителя (рекомендуется)
        // В этом случае модель будет двигаться с маркером, но останется в его центре
      }
      
      return; // Выходим сразу после фиксации
    }
    
    // Проверяем видимость маркера
    const markerVisible = parent.getAttribute('visible') !== false;
    
    if (!markerVisible) {
      return;
    }
    
    // Инициализация при первом обнаружении маркера
    if (!this.initialized) {
      if (markerVisible) {
        const worldPos = new THREE.Vector3();
        src.getWorldPosition(worldPos);
        
        const isValidPos = !isNaN(worldPos.x) && !isNaN(worldPos.y) && !isNaN(worldPos.z) &&
                           (Math.abs(worldPos.x) > 0.001 || Math.abs(worldPos.y) > 0.001 || Math.abs(worldPos.z) > 0.001);
        
        if (isValidPos) {
          this.stablePosition = new THREE.Vector3(0, 0, 0);
          this.targetPosition = this.stablePosition.clone();
          this.positionHistory = [];
          for (let i = 0; i < 5; i++) {
            this.positionHistory.push(this.stablePosition.clone());
          }
          this.initialized = true;
          this.lastUpdateTime = currentTime;
          
          // ПОЛНОСТЬЮ замораживаем локальную позицию относительно маркера
          if (this.data.freezeAfterInit) {
            // Устанавливаем локальную позицию на 0,0,0 относительно маркера
            dst.position.set(0, 0, 0);
            dst.quaternion.set(0, 0, 0, 1);
            dst.scale.set(1, 1, 1);
            
            // Обновляем матрицы
            dst.updateMatrix();
            if (dst.parent) {
              dst.updateMatrixWorld(true);
            }
            
            // Сохраняем масштаб для блокировки
            this.frozenScale = dst.scale.clone();
            
            // Можно сохранить мировую матрицу, но лучше не использовать её
            // чтобы модель двигалась вместе с маркером
            // this.frozenWorldMatrix = dst.matrixWorld.clone();
            
            // Включаем заморозку позиции
            this.positionFrozen = true;
            
            // Блокируем автоматическое обновление матрицы
            // Но мировая матрица будет обновляться от родителя (маркера)
            dst.matrixAutoUpdate = false;
            
            console.log('Модель зафиксирована на позиции 0,0,0 относительно маркера');
          }
        }
      }
      return;
    }
    
    // Если позиция заморожена - не обновляем
    if (this.positionFrozen) {
      return;
    }
    
    // Обновляем позицию с интервалом
    if (timeSinceUpdate >= this.data.updateInterval) {
      const currentPos = new THREE.Vector3(0, 0, 0);
      
      // Добавляем в историю для медианного фильтра
      this.positionHistory.push(currentPos.clone());
      if (this.positionHistory.length > 5) {
        this.positionHistory.shift();
      }
      
      // Медианный фильтр
      const sortedX = this.positionHistory.map(p => p.x).sort((a, b) => a - b);
      const sortedY = this.positionHistory.map(p => p.y).sort((a, b) => a - b);
      const sortedZ = this.positionHistory.map(p => p.z).sort((a, b) => a - b);
      const medianPos = new THREE.Vector3(
        sortedX[Math.floor(sortedX.length / 2)],
        sortedY[Math.floor(sortedY.length / 2)],
        sortedZ[Math.floor(sortedZ.length / 2)]
      );
      
      if (this.stablePosition) {
        // Вычисляем скорость движения
        if (this.data.useVelocityFilter) {
          const deltaTime = timeSinceUpdate / 1000; // в секундах
          this.velocity.subVectors(medianPos, this.lastPosition).divideScalar(deltaTime || 0.001);
          this.lastPosition.copy(medianPos);
          
          // Адаптивная фильтрация: если скорость высокая, увеличиваем порог
          let adaptiveThreshold = this.data.minMoveDistance;
          if (this.data.adaptiveFiltering) {
            const speed = this.velocity.length();
            adaptiveThreshold = this.data.minMoveDistance * (1 + speed * 2);
          }
          
          const distance = this.stablePosition.distanceTo(medianPos);
          
          if (distance >= adaptiveThreshold) {
            this.targetPosition.copy(medianPos);
            
            // Используем EMA или обычную интерполяцию
            if (this.data.useEMA) {
              // Экспоненциальное скользящее среднее
              this.stablePosition.lerp(this.targetPosition, this.emaAlpha);
            } else {
              // Обычная интерполяция
              this.stablePosition.lerp(this.targetPosition, this.data.smoothing);
            }
          }
        } else {
          // Простая проверка расстояния без фильтрации скорости
          const distance = this.stablePosition.distanceTo(medianPos);
          
          if (distance >= this.data.minMoveDistance) {
            this.targetPosition.copy(medianPos);
            
            if (this.data.useEMA) {
              this.stablePosition.lerp(this.targetPosition, this.emaAlpha);
            } else {
              this.stablePosition.lerp(this.targetPosition, this.data.smoothing);
            }
          }
        }
        
        dst.position.copy(this.stablePosition);
        
        // Блокируем масштаб, если включено
        if (this.data.lockScale) {
          dst.scale.set(1, 1, 1);
        }
        
        dst.updateMatrix();
      } else {
        dst.position.set(0, 0, 0);
        if (this.data.lockScale) {
          dst.scale.set(1, 1, 1);
        }
        dst.updateMatrix();
      }
      
      this.lastUpdateTime = currentTime;
    }
  }
});

// Функция создания маркера с моделями
function createMarker(index) {
  const marker = document.createElement('a-entity');
  marker.setAttribute('mindar-image-target', `targetIndex:${index}`);
  scene.appendChild(marker);

  // Контейнер моделей с стабилизацией
  const content = document.createElement('a-entity');
  content.setAttribute('position','0 0 0');
  content.setAttribute('model-stabilizer', 'smoothing: 0.05; updateInterval: 300; minMoveDistance: 0.15; freezeAfterInit: true; useEMA: true; useVelocityFilter: true; lockScale: true; adaptiveFiltering: true');

  // Модель слев
  const leftWrapper = document.createElement('a-entity');
  leftWrapper.setAttribute('position','-0.5 -0.5 0');
  const leftModel = document.createElement('a-entity');
  leftModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox.glb');
  leftModel.setAttribute('scale','0.05 0.05 0.05');
  leftModel.setAttribute('animation-mixer','clip:*; loop:repeat');
  leftWrapper.appendChild(leftModel);
  content.appendChild(leftWrapper);

  // Модель справа
  const rightWrapper = document.createElement('a-entity');
  rightWrapper.setAttribute('position','0.5 -0.5 0');
  const rightModel = document.createElement('a-entity');
  rightModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb');
  rightModel.setAttribute('scale','0.05 0.05 0.05');
  rightModel.setAttribute('animation-mixer','clip:*; loop:repeat');
  rightWrapper.appendChild(rightModel);
  content.appendChild(rightWrapper);

  marker.appendChild(content);

  marker.addEventListener('targetFound', ()=>{
    content.setAttribute('visible', true);
    status.textContent = 'Маркер найден';
  });

  marker.addEventListener('targetLost', ()=>{
    setTimeout(()=>{
      content.setAttribute('visible', false);
      status.textContent = 'Наведи камеру на маркер';
    },200);
  });

  return marker;
}

// Создаем маркеры
for(let i=0;i<markersCount;i++){
  createMarker(i);
}

// Старт AR и музыки по кнопке
startBtn.addEventListener('click', async ()=>{
  startBtn.disabled = true;
  startScreen.style.display='none';
  status.style.display='block';
  try {
    const mindar = scene.systems['mindar-image-system'];
    await mindar.start();
    const music = document.getElementById('music');
    music.components.sound.playSound();
  } catch(e){
    alert('Камера недоступна или отказано в доступе. Обновите страницу и попробуйте снова.');
    console.error(e);
  }
});
</script>

</body>
</html>
