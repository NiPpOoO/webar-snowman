<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>WebAR: снеговик как NFT‑маркер</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />

  <!-- A‑Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- AR.js NFT -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <!-- UI -->
  <div id="ui" class="ui">Наведи камеру на снеговика — появятся фигуры 🦊🐇</div>
  <div id="bar" class="bar">
    <button id="flip" class="btn">Сменить камеру</button>
    <button id="shot" class="btn">Снимок</button>
  </div>

  <!-- Уведомление о неподдерживаемом устройстве -->
  <div id="unsupported" class="unsupported" style="display:none;">
    ❌ Ваше устройство или браузер не поддерживает WebAR. Попробуйте открыть сайт в Safari (iOS) или Chrome (Android).
  </div>

  <!-- AR‑сцена -->
  <a-scene
    id="scene"
    embedded
    renderer="colorManagement:true; antialias:false; alpha:true;"
    vr-mode-ui="enabled:false"
    arjs="trackingMethod:nft; sourceType:webcam; debugUIEnabled:false;"
  >
    <!-- NFT‑маркер снеговика -->
    <a-nft
      id="marker"
      type="nft"
      url="assets/markers/snowman/snowman"
      emitevents="true"
    >
      <!-- Временные фигуры -->
      <a-box position="-0.5 0 0" scale="0.3 0.3 0.3" color="#ff6600"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 6000"></a-box>
      <a-sphere position="0.5 0 0" scale="0.25 0.25 0.25" color="#ffffff"
                animation="property: position; to: 0.5 0.15 0; dir: alternate; loop: true; dur: 2200"></a-sphere>

      <!-- Освещение -->
      <a-entity light="type: ambient; intensity: 0.6"></a-entity>
      <a-entity light="type: directional; intensity: 1.1" position="1 2 1"></a-entity>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script src="src/script.js"></script>
</body>
</html>
