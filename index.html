<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — Статичные модели</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<style>
html,body{
  margin:0; width:100%; height:100%; overflow:hidden;
}
#start{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:10; background:#000;
}
#start button{
  padding:16px 28px; font-size:16px; border-radius:12px; border:none;
}
</style>
</head>

<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>

<a-scene embedded vr-mode-ui="enabled:false" renderer="alpha:true">

  <!-- Камера с реальным видео на фоне -->
  <a-entity camera look-controls="enabled:false">

    <!-- HUD контейнер: статичные модели -->
    <a-entity id="hud" position="0 0 -2">

      <!-- Левая модель -->
      <a-entity
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
        position="-0.6 -0.4 0"
        scale="0.05 0.05 0.05"
        animation-mixer>
      </a-entity>

      <!-- Правая модель -->
      <a-entity
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
        position="0.6 -0.4 0"
        scale="0.05 0.05 0.05"
        animation-mixer>
      </a-entity>

    </a-entity>

  </a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');

startBtn.onclick = async () => {
  startBtn.disabled = true;
  startScreen.style.display='none';

  try {
    // Запрос камеры через WebRTC
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    const video = document.createElement('video');
    video.srcObject = stream;
    video.play();

    // Можно добавить видео на фон через <a-video>, если нужно
    // Но A-Frame сам покажет камеру на фоне сцены

  } catch(e) {
    alert('Не удалось включить камеру');
    console.error(e);
  }
};
</script>

</body>
</html>
