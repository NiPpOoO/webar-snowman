<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>WebAR: Снеговик с анимацией</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Стабильная связка -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar-nft.js"></script>

  <style>
    #status {
      position: absolute; top: 10px; right: 10px;
      padding: 8px 12px; background: rgba(0,0,0,0.6);
      color: #fff; border-radius: 6px; font-size: 14px; z-index: 3;
    }
    #switchBtn {
      position: absolute; top: 50px; right: 10px;
      padding: 8px 12px; background: rgba(0,0,0,0.6);
      color: #fff; border-radius: 6px; font-size: 14px; cursor: pointer; z-index: 3;
    }

    .arjs-video, video[playsinline] {
      position: fixed; left: 0; top: 0;
      width: 100vw; height: 100vh;
      object-fit: contain;
      z-index: 1; background: #000;
    }
    canvas.a-canvas {
      position: fixed !important;
      left: 0; top: 0; width: 100vw !important; height: 100vh !important;
      z-index: 2; pointer-events: none;
    }

    .arjs-loader {
      position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center; z-index: 4;
    }
    .arjs-loader > div {
      background: rgba(0,0,0,0.6); color: #fff; padding: 10px 18px;
      border-radius: 8px; font-size: 14px;
    }
  </style>
</head>
<body style="margin:0; overflow:hidden;">
  <div class="arjs-loader"><div>Загрузка маркеров, подождите…</div></div>

  <div id="status">Маркер не виден</div>
  <button id="switchBtn">Сменить модель</button>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; facingMode: environment; debugUIEnabled: false;"
  >
    <a-assets timeout="30000">
      <a-asset-item id="mdl-fox" src="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"></a-asset-item>
      <a-asset-item id="mdl-penguin" src="https://nippooo.github.io/webar-snowman/assets/models/Penguin.glb"></a-asset-item>
      <a-asset-item id="mdl-bear" src="https://nippooo.github.io/webar-snowman/assets/models/Bear.glb"></a-asset-item>
    </a-assets>

    <!-- Один маркер снеговика -->
    <a-nft id="snowman" type="nft"
      url="https://nippooo.github.io/webar-snowman/assets/markers/snowman/snowman"
      emitevents="true">
      <a-entity id="model-snowman"
        gltf-model="#mdl-fox"
        scale="0.3 0.3 0.3"
        position="0 0 0"
        visible="false"
        animation-mixer>
      </a-entity>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById('status');
    const switchBtn = document.getElementById('switchBtn');

    const modelIds = ['#mdl-fox', '#mdl-penguin', '#mdl-bear'];
    let currentIndex = 0;

    const marker = document.getElementById('snowman');
    const modelEntity = document.getElementById('model-snowman');

    marker.addEventListener('markerFound', () => {
      status.textContent = "Снеговик виден";
      modelEntity.setAttribute('visible', true);
    });

    marker.addEventListener('markerLost', () => {
      status.textContent = "Снеговик не виден";
      modelEntity.setAttribute('visible', false);
    });

    switchBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % modelIds.length;
      modelEntity.setAttribute('gltf-model', modelIds[currentIndex]);
    });

    const sceneEl = document.querySelector('a-scene');
    sceneEl.addEventListener('loaded', () => {
      const loader = document.querySelector('.arjs-loader');
      if (loader) loader.style.display = 'none';
      console.log('✅ Сцена загружена, ждём маркер...');
    });
  </script>
</body>
</html>
