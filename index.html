<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 1Stable MultiMarker Preload</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:10; }
#start button { padding:16px 26px; font-size:16px; border-radius:10px; border:none; }
#status { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.6); color:#fff; padding:8px 12px; border-radius:6px; z-index:11; display:none; }
</style>
</head>
<body>

<div id="start">
  <button id="startBtn" disabled>Загрузка моделей...</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false; filterMinCF:0.0003; filterBeta:3;" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" renderer="alpha:true">
  <a-camera look-controls="enabled:false"></a-camera>
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay:false; loop:true; volume:0.5"></a-entity>
</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const status = document.getElementById('status');
const scene = document.querySelector('a-scene');

const markersCount = 6;
let activeMarker = null;

// Контейнер для сглаживания
const contentRoot = document.createElement('a-entity');
scene.appendChild(contentRoot);
contentRoot.setAttribute('smooth-follow','');
contentRoot.setAttribute('visible','false');

// Smooth follow
AFRAME.registerComponent('smooth-follow', {
  tick() {
    if (!activeMarker) return;
    const src = activeMarker.object3D;
    const dst = contentRoot.object3D;
    dst.position.lerp(src.position, 0.03); // очень медленно
    dst.quaternion.slerp(src.quaternion, 0.03);
  }
});

// Предзагрузка моделей
function preloadModels(urls, callback) {
  let loaded = 0;
  const total = urls.length;
  urls.forEach(url => {
    const entity = document.createElement('a-entity');
    entity.setAttribute('gltf-model', url);
    entity.addEventListener('model-loaded', ()=> {
      loaded++;
      if (loaded === total) callback();
    });
    // скрываем entity после загрузки
    entity.setAttribute('visible','false');
    scene.appendChild(entity);
  });
}

// Создаем маркеры с контентом
function createMarker(index) {
  const marker = document.createElement('a-entity');
  marker.setAttribute('mindar-image-target', `targetIndex:${index}`);
  scene.appendChild(marker);

  const content = document.createElement('a-entity');
  content.setAttribute('position','0 0 0');

  // Левая модель
  const leftWrapper = document.createElement('a-entity');
  leftWrapper.setAttribute('position','-0.6 -0.4 0');
  leftWrapper.setAttribute('smooth-follow','');
  const leftModel = document.createElement('a-entity');
  leftModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox.glb');
  leftModel.setAttribute('scale','0.05 0.05 0.05');
  leftModel.setAttribute('animation-mixer','clip:*; loop:repeat');
  leftWrapper.appendChild(leftModel);
  content.appendChild(leftWrapper);

  // Правая модель
  const rightWrapper = document.createElement('a-entity');
  rightWrapper.setAttribute('position','0.6 -0.4 0');
  rightWrapper.setAttribute('smooth-follow','');
  const rightModel = document.createElement('a-entity');
  rightModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb');
  rightModel.setAttribute('scale','0.05 0.05 0.05');
  rightModel.setAttribute('animation-mixer','clip:*; loop:repeat');
  rightWrapper.appendChild(rightModel);
  content.appendChild(rightWrapper);

  marker.appendChild(content);

  marker.addEventListener('targetFound', ()=>{
    activeMarker = marker;
    contentRoot.setAttribute('visible', true);
    status.textContent = 'Маркер найден';
  });

  marker.addEventListener('targetLost', ()=>{
    setTimeout(()=>{
      if(activeMarker===marker){
        activeMarker = null;
        contentRoot.setAttribute('visible', false);
        status.textContent = 'Наведи камеру на маркер';
      }
    },200);
  });

  return marker;
}

// ===== Предзагрузка всех моделей =====
const modelUrls = [
  'https://nippooo.github.io/webar-snowman/assets/models/Fox.glb',
  'https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb'
];

preloadModels(modelUrls, ()=> {
  startBtn.disabled = false;
  startBtn.textContent = 'Запустить AR';
});

// Создаем маркеры
for(let i=0;i<markersCount;i++){
  createMarker(i);
}

// ===== Старт AR =====
startBtn.addEventListener('click', async ()=>{
  document.getElementById('start').style.display='none';
  status.style.display='block';
  try {
    const mindar = scene.systems['mindar-image-system'];
    await mindar.start();
    document.getElementById('music').components.sound.playSound();
  } catch(e){
    alert('Нет доступа к камере');
    console.error(e);
  }
});
</script>

</body>
</html>
