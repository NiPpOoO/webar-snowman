<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 34 </title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

#overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  background:#000;
}

#overlay button{
  padding:14px 24px;
  font-size:16px;
  border-radius:10px;
  border:none;
}

#status{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.65);
  color:#fff;
  padding:8px 12px;
  border-radius:6px;
  font-size:14px;
  z-index:101;
  display:none;
}

a-scene{
  position:fixed !important;
  inset:0;
  background:transparent !important;
}
</style>
</head>

<body>

<!-- Overlay -->
<div id="overlay">
  <button id="enter">Запустить AR</button>
</div>

<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind;"
  vr-mode-ui="enabled:false"
  renderer="alpha:true"
>
  <a-camera look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex:0">
    <a-box
      position="0 0 0"
      width="0.25"
      height="0.25"
      depth="0.25"
      color="#ff0000">
    </a-box>
  </a-entity>
</a-scene>

<script>
const overlay = document.getElementById('overlay');
const status = document.getElementById('status');

document.getElementById('enter').addEventListener('click', () => {
  overlay.style.display = 'none';
  status.style.display = 'block';
});
</script>

</body>
</html>
