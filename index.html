<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — Fixed & Stable</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
#start {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
#start button {
  padding: 16px 28px;
  font-size: 16px;
  border-radius: 12px;
  border: none;
}
#status {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.65);
  color: #fff;
  padding: 8px 14px;
  border-radius: 8px;
  z-index: 11;
  display: none;
}
</style>
</head>

<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true"
  embedded>

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Музыка -->
  <a-entity
    id="music"
    sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3);
           autoplay:false;
           loop:true;
           volume:0.5">
  </a-entity>

</a-scene>

<script>
const scene = document.querySelector('a-scene');
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');

const MARKERS_COUNT = 6;

function createMarker(index) {

  const marker = document.createElement('a-entity');
  marker.setAttribute('mindar-image-target', `targetIndex:${index}`);
  scene.appendChild(marker);

  const content = document.createElement('a-entity');
  content.setAttribute('visible', 'false');

  // ЛЕВАЯ МОДЕЛЬ
  const left = document.createElement('a-entity');
  left.setAttribute('gltf-model', 'https://nippooo.github.io/webar-snowman/assets/models/Fox.glb');
  left.setAttribute('position', '-0.5 -0.5 0');
  left.setAttribute('scale', '0.05 0.05 0.05');
  left.setAttribute('animation-mixer', '');
  content.appendChild(left);

  // ПРАВАЯ МОДЕЛЬ
  const right = document.createElement('a-entity');
  right.setAttribute('gltf-model', 'https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb');
  right.setAttribute('position', '0.5 -0.5 0');
  right.setAttribute('scale', '0.05 0.05 0.05');
  right.setAttribute('animation-mixer', '');
  content.appendChild(right);

  marker.appendChild(content);

  let fixed = false;

  marker.addEventListener('targetFound', () => {
    if (fixed) return;
    fixed = true;

    // ОБНОВЛЯЕМ МИРОВУЮ МАТРИЦУ
    content.object3D.updateMatrixWorld(true);

    const worldPos = new THREE.Vector3();
    const worldQuat = new THREE.Quaternion();

    content.object3D.getWorldPosition(worldPos);
    content.object3D.getWorldQuaternion(worldQuat);

    // ОТВЯЗЫВАЕМ ОТ МАРКЕРА
    marker.removeChild(content);
    scene.object3D.add(content.object3D);

    // ФИКСИРУЕМ В МИРЕ
    content.object3D.position.copy(worldPos);
    content.object3D.quaternion.copy(worldQuat);
    content.object3D.scale.set(1,1,1);

    content.setAttribute('visible', 'true');
    status.textContent = 'Модели зафиксированы';
  });
}

// СОЗДАЁМ ВСЕ МАРКЕРЫ
for (let i = 0; i < MARKERS_COUNT; i++) {
  createMarker(i);
}

// ЗАПУСК AR
startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startScreen.style.display = 'none';
  status.style.display = 'block';

  try {
    const mindar = scene.systems['mindar-image-system'];
    await mindar.start();
    document.getElementById('music').components.sound.playSound();
  } catch (e) {
    alert('Не удалось получить доступ к камере');
    console.error(e);
  }
});
</script>

</body>
</html>
