<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>WebAR: Несколько маркеров снеговика</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Стабильная связка -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar-nft.js"></script>

  <style>
    #status {
      position: absolute; top: 10px; right: 10px;
      padding: 8px 12px; background: rgba(0,0,0,0.6);
      color: #fff; border-radius: 6px; font-size: 14px; z-index: 3;
    }
    #switchBtn {
      position: absolute; top: 50px; right: 10px;
      padding: 8px 12px; background: rgba(0,0,0,0.6);
      color: #fff; border-radius: 6px; font-size: 14px; cursor: pointer; z-index: 3;
    }

    /* Анти‑зум */
    #arjs-video, video[playsinline] {
      position: fixed; left: 0; top: 0;
      width: 100vw; height: 100vh;
      object-fit: contain;
      transform: scale(0.85); /* уменьшаем масштаб, чтобы компенсировать кроп */
      z-index: 1; background: #000;
    }
    canvas.a-canvas {
      position: fixed !important;
      left: 0; top: 0; width: 100vw !important; height: 100vh !important;
      z-index: 2; pointer-events: none;
    }
  </style>
</head>
<body style="margin:0; overflow:hidden;">
  <div class="arjs-loader"><div>Загрузка маркеров, подождите…</div></div>

  <div id="status">Маркер не виден</div>
  <button id="switchBtn">Сменить модель</button>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; facingMode: environment; debugUIEnabled: false;"
  >
    <a-nft id="snowman" type="nft"
      url="./assets/markers/snowman/snowman"
      emitevents="true">
      <a-entity id="model-snowman"
        gltf-model="./assets/models/Fox.glb"
        scale="0.3 0.3 0.3" position="0 0 0" visible="false"></a-entity>
    </a-nft>

    <a-nft id="snowman1" type="nft"
      url="./assets/markers/snowman1/snowman1"
      emitevents="true">
      <a-entity id="model-snowman1"
        gltf-model="./assets/models/Fox.glb"
        scale="0.3 0.3 0.3" position="0 0 0" visible="false"></a-entity>
    </a-nft>

    <a-nft id="snowman2" type="nft"
      url="./assets/markers/snowman2/snowman2"
      emitevents="true">
      <a-entity id="model-snowman2"
        gltf-model="./assets/models/Fox.glb"
        scale="0.3 0.3 0.3" position="0 0 0" visible="false"></a-entity>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById('status');
    const switchBtn = document.getElementById('switchBtn');

    const models = [
      "./assets/models/Fox.glb",
      "./assets/models/Penguin.glb",
      "./assets/models/Bear.glb"
    ];
    let currentIndex = 0;

    function setupMarker(markerId, modelId, markerName) {
      const marker = document.getElementById(markerId);
      const modelEntity = document.getElementById(modelId);

      marker.addEventListener('markerFound', () => {
        status.textContent = `${markerName} виден`;
        modelEntity.setAttribute('visible', true);
      });

      marker.addEventListener('markerLost', () => {
        status.textContent = `${markerName} не виден`;
      });

      switchBtn.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % models.length;
        modelEntity.setAttribute('gltf-model', models[currentIndex]);
      });
    }

    setupMarker('snowman', 'model-snowman', 'Снеговик');
    setupMarker('snowman1', 'model-snowman1', 'Снеговик1');
    setupMarker('snowman2', 'model-snowman2', 'Снеговик2');

    // Ждём готовности сцены
    const sceneEl = document.querySelector('a-scene');
    sceneEl.addEventListener('loaded', () => {
      const arSystem = sceneEl.systems['arjs'];
      if (!arSystem || !arSystem.arSource) {
        status.textContent = 'AR.js источник не найден';
        console.error('AR.js источник не найден');
      } else {
        status.textContent = 'Камера готова';
        console.log('✅ AR.js источник найден');
      }
    });
  </script>
</body>
</html>
