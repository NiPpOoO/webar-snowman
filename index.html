<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>WebAR: Несколько маркеров снеговика</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <!-- AR.js (NFT) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    /* Индикаторы */
    #status {
      position: absolute; top: 10px; right: 10px;
      padding: 8px 12px; background: rgba(0,0,0,0.6);
      color: #fff; border-radius: 6px; font-size: 14px; z-index: 3;
    }
    #switchBtn {
      position: absolute; top: 50px; right: 10px;
      padding: 8px 12px; background: rgba(0,0,0,0.6);
      color: #fff; border-radius: 6px; font-size: 14px; cursor: pointer; z-index: 3;
    }

    /* Видеопоток AR.js: без кропа, максимально широкий угол */
    #arjs-video, video[playsinline] {
      position: fixed; left: 0; top: 0;
      width: 100vw; height: 100vh;
      object-fit: contain; /* убирает визуальный "зум" от кропа */
      z-index: 1; background: #000;
    }

    /* Canvas A-Frame поверх видео */
    canvas.a-canvas {
      position: fixed !important;
      left: 0; top: 0; width: 100vw !important; height: 100vh !important;
      z-index: 2; pointer-events: none;
    }
  </style>
</head>
<body style="margin:0; overflow:hidden;">
  <div class="arjs-loader"><div>Загрузка маркеров, подождите…</div></div>

  <div id="status">Маркер не виден</div>
  <button id="switchBtn">Сменить модель</button>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    /* задаём совместимые параметры источника, чтобы AR.js не растягивал под странные размеры */
    arjs="trackingMethod: best; sourceType: webcam; facingMode: environment; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;"
  >
    <!-- Маркеры -->
    <a-nft id="snowman" type="nft"
      url="https://nippooo.github.io/webar-snowman/assets/markers/snowman/snowman"
      emitevents="true">
      <a-entity id="model-snowman"
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
        scale="0.3 0.3 0.3" position="0 0 0" visible="false"></a-entity>
    </a-nft>

    <a-nft id="snowman1" type="nft"
      url="https://nippooo.github.io/webar-snowman/assets/markers/snowman1/snowman1"
      emitevents="true">
      <a-entity id="model-snowman1"
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
        scale="0.3 0.3 0.3" position="0 0 0" visible="false"></a-entity>
    </a-nft>

    <a-nft id="snowman2" type="nft"
      url="https://nippooo.github.io/webar-snowman/assets/markers/snowman2/snowman2"
      emitevents="true">
      <a-entity id="model-snowman2"
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
        scale="0.3 0.3 0.3" position="0 0 0" visible="false"></a-entity>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById('status');
    const switchBtn = document.getElementById('switchBtn');

    const models = [
      "https://nippooo.github.io/webar-snowman/assets/models/Fox.glb",
      "https://nippooo.github.io/webar-snowman/assets/models/Penguin.glb",
      "https://nippooo.github.io/webar-snowman/assets/models/Bear.glb"
    ];
    let currentIndex = 0;

    function setupMarker(markerId, modelId, markerName) {
      const marker = document.getElementById(markerId);
      const modelEntity = document.getElementById(modelId);

      marker.addEventListener('markerFound', () => {
        status.textContent = `${markerName} виден`;
        modelEntity.setAttribute('visible', true);
      });

      marker.addEventListener('markerLost', () => {
        status.textContent = `${markerName} не виден`;
      });

      switchBtn.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % models.length;
        modelEntity.setAttribute('gltf-model', models[currentIndex]);
      });
    }

    setupMarker('snowman', 'model-snowman', 'Снеговик');
    setupMarker('snowman1', 'model-snowman1', 'Снеговик1');
    setupMarker('snowman2', 'model-snowman2', 'Снеговик2');

    // Универсальная и безопасная инициализация камеры без OverconstrainedError и визуального "зума"
    window.addEventListener('load', async () => {
      const sceneEl = document.querySelector('a-scene');
      const arSource = sceneEl.systems?.arjs?.arSource;

      if (!arSource) {
        status.textContent = 'AR.js источник не найден';
        return;
      }

      try {
        // 1) Получаем доступ к камере и список устройств
        // Только facingMode: "environment" — самый совместимый вариант
        let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });

        // Метки устройств появляются только после разрешения
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');

        // 2) Выбираем "лучшую" заднюю камеру (эвристики против телефото-зумов)
        const pickBestBackCamera = (list) => {
          // приоритет: метки с "back" / "rear" / "wide"
          const byLabel = list.find(d => /back|rear|wide/i.test(d.label)) ||
                          list.find(d => /environment/i.test(d.label)) ||
                          list.find(d => !/front|user/i.test(d.label));
          return byLabel || list[0];
        };

        const bestCam = pickBestBackCamera(videoDevices);

        // 3) Если нашли deviceId — берём поток по exact, иначе остаёмся на текущем stream
        if (bestCam && bestCam.deviceId) {
          try {
            // exact — только после получения разрешения, иначе будет Overconstrained на iOS
            stream = await navigator.mediaDevices.getUserMedia({
              video: { deviceId: { exact: bestCam.deviceId } }
            });
          } catch (e) {
            console.warn('Не удалось захватить выбранную заднюю камеру, остаёмся на facingMode: environment', e.name);
          }
        }

        // 4) Подготовка видео-элемента AR.js
        const prevStream = arSource?.domElement?.srcObject;
        if (prevStream && prevStream.getTracks) prevStream.getTracks().forEach(t => t.stop());

        // Убедимся, что видео не будет кропиться визуально
        arSource.domElement.setAttribute('id', 'arjs-video');
        arSource.domElement.setAttribute('playsinline', true);
        arSource.domElement.muted = true; // iOS autoplay
        arSource.domElement.autoplay = true;

        // Подмена потока
        arSource.domElement.srcObject = stream;
        await arSource.domElement.play().catch(() => { /* на некоторых браузерах auto-play сам запустится */ });

        // Обновить размеры AR.js → canvas
        arSource.ready = true;
        arSource.onResizeElement();
        arSource.copyElementSizeTo(sceneEl.canvas);

        // 5) Логи: смотрим реальное разрешение и метку устройства
        const track = stream.getVideoTracks()[0];
        const settings = track.getSettings();
        console.log('📷 Камера активна:', settings, 'device:', bestCam ? bestCam.label : '(неизвестно)');
        status.textContent = `Камера: ${settings.width}×${settings.height}${bestCam && bestCam.label ? ' | ' + bestCam.label : ''}`;

      } catch (err) {
        console.error('❌ Ошибка камеры:', err);
        status.textContent = `Ошибка камеры: ${err.name}`;
        // Fallback: пробуем без явных параметров
        try {
          const streamFallback = await navigator.mediaDevices.getUserMedia({ video: true });
          arSource.domElement.srcObject = streamFallback;
          arSource.ready = true;
          arSource.onResizeElement();
          arSource.copyElementSizeTo(sceneEl.canvas);
          const s = streamFallback.getVideoTracks()[0].getSettings();
          status.textContent = `Камера (fallback): ${s.width}×${s.height}`;
        } catch (err2) {
          console.error('❌ Fallback тоже не удалось:', err2);
        }
      }
    });
  </script>
</body>
</html>
