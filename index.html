<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebAR Snowman</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <link rel="stylesheet" href="./src/style.css" />
    <script src="./src/script.js" defer></script>
  </head>
  <body style="margin:0;overflow:hidden;">
    <!-- AR сцена: включён debug UI для диагностики -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: true; detectionMode: mono; patternRatio: 0.5;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
    >
      <!-- NFT метка снеговика -->
      <a-nft
        id="nft-snowman"
        type="nft"
        url="./assets/markers/snowman/snowman"
        emitevents="true"
        minConfidence="0.3"
      >
        <!-- Куб-индикатор для NFT -->
        <a-box id="cube-nft" position="0 0 0" depth="0.5" height="0.5" width="0.5" color="#ff4444"></a-box>
      </a-nft>

      <!-- Hiro метка (временная/дополнительная) -->
      <a-marker id="marker-hiro" preset="hiro" emitevents="true">
        <a-box id="cube-hiro" position="0 0.25 0" depth="0.5" height="0.5" width="0.5" color="#4444ff"></a-box>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <!-- UI (вне сцены, всегда поверх) -->
    <div id="ui">Наведи камеру на снеговика</div>
    <div id="test-status">🔍 Статус: ничего не найдено</div>
    <button id="shot">📸 Снимок</button>
  </body>
</html>
