<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — Fixed Copy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:true;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Маркер с временными моделями -->
  <a-entity id="marker" mindar-image-target="targetIndex:0">
    <a-entity id="tempLeft" gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
              scale="0.05 0.05 0.05"
              visible="false"
              animation-mixer="clip:*; loop:repeat">
    </a-entity>
    <a-entity id="tempRight" gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
              scale="0.05 0.05 0.05"
              visible="false"
              animation-mixer="clip:*; loop:repeat">
    </a-entity>
  </a-entity>

  <!-- Независимые копии вне маркера -->
  <a-entity id="fixedLeft" gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
            scale="0.05 0.05 0.05"
            visible="false"
            animation-mixer="clip:*; loop:repeat">
  </a-entity>

  <a-entity id="fixedRight" gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
            scale="0.05 0.05 0.05"
            visible="false"
            animation-mixer="clip:*; loop:repeat">
  </a-entity>

</a-scene>

<script>
const marker = document.getElementById('marker');
const tempLeft = document.getElementById('tempLeft');
const tempRight = document.getElementById('tempRight');
const fixedLeft = document.getElementById('fixedLeft');
const fixedRight = document.getElementById('fixedRight');

marker.addEventListener('targetFound', () => {
  // показать временные модели внутри маркера
  tempLeft.setAttribute('visible', true);
  tempRight.setAttribute('visible', true);

  // получить мировые координаты
  const worldPosL = new THREE.Vector3();
  const worldQuatL = new THREE.Quaternion();
  tempLeft.object3D.getWorldPosition(worldPosL);
  tempLeft.object3D.getWorldQuaternion(worldQuatL);

  const worldPosR = new THREE.Vector3();
  const worldQuatR = new THREE.Quaternion();
  tempRight.object3D.getWorldPosition(worldPosR);
  tempRight.object3D.getWorldQuaternion(worldQuatR);

  // перенести в независимые копии
  fixedLeft.object3D.position.copy(worldPosL);
  fixedLeft.object3D.quaternion.copy(worldQuatL);
  fixedRight.object3D.position.copy(worldPosR);
  fixedRight.object3D.quaternion.copy(worldQuatR);

  fixedLeft.setAttribute('visible', true);
  fixedRight.setAttribute('visible', true);

  // скрыть временные модели внутри маркера
  tempLeft.setAttribute('visible', false);
  tempRight.setAttribute('visible', false);
});

marker.addEventListener('targetLost', () => {
  // НЕ скрываем — копии остаются навсегда
});
</script>

</body>
</html>
