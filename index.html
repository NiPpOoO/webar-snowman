<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 17</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
  }
  video { 
    position: fixed; top:0; left:0; width:100vw; height:100vh; object-fit: cover; z-index:0; 
  }
  #start { 
    position: fixed; inset:0; display:flex; align-items:center; justify-content:center; 
    background:#000; z-index:100; 
  }
  #start button { padding:14px 22px; font-size:16px; border-radius:10px; border:none; }
  #status { position: fixed; bottom:12px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.65); color:#fff; padding:8px 12px; border-radius:6px; font-size:14px;
    z-index:101; display:none;
  }
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>

<div id="status">Наведи камеру на маркер</div>

<!-- SCENE -->
<a-scene id="scene" embedded vr-mode-ui="enabled:false" renderer="alpha:true">
  <a-camera id="camera" look-controls="enabled:false"></a-camera>

  <!-- TARGET/МОДЕЛЬ -->
  <a-entity id="model" position="0 0 -1" visible="false">
    <a-box color="#ff6600" depth="0.3" height="0.3" width="0.3"></a-box>
  </a-entity>
</a-scene>

<script>
(async () => {
  const startBtn = document.getElementById('startBtn');
  const startScreen = document.getElementById('start');
  const status = document.getElementById('status');
  const scene = document.getElementById('scene');
  const model = document.getElementById('model');

  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      const video = document.createElement('video');
      video.srcObject = stream;
      video.autoplay = true;
      video.playsInline = true;
      document.body.appendChild(video);
      return true;
    } catch (e) {
      alert("Доступ к камере запрещен или недоступен");
      return false;
    }
  }

  async function initAR() {
    if (navigator.xr && navigator.xr.isSessionSupported) {
      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (supported) {
        status.textContent = 'WebXR AR доступен';
        model.setAttribute('visible', true);
        // Здесь позже можно добавить анимированную gltf модель через a-gltf-model
      } else {
        status.textContent = 'WebXR AR не поддерживается, fallback включен';
        model.setAttribute('visible', true);
      }
    } else {
      status.textContent = 'WebXR AR не поддерживается, fallback включен';
      model.setAttribute('visible', true);
    }
  }

  startBtn.addEventListener('click', async () => {
    const ok = await initCamera();
    if(!ok) return;
    startScreen.style.display = 'none';
    status.style.display = 'block';
    await initAR();
  });
})();
</script>

</body>
</html>
