<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 5Статичные модели с анимацией</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center; z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px; border-radius:10px; border:none;
}
#status {
  position:fixed; bottom:12px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  color:#fff; padding:8px 12px;
  border-radius:6px; z-index:11;
  display:none;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:true"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay: false; loop: true; volume:0.5"></a-entity>

  <!-- Контейнер для статичных моделей -->
  <a-entity id="modelsContainer" visible="false" position="0 0 -2">

    <a-entity id="leftModel"
      gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
      position="-0.5 -0.5 0"
      scale="0.05 0.05 0.05"
      animation-mixer>
    </a-entity>

    <a-entity id="rightModel"
      gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
      position="0.5 -0.5 0"
      scale="0.05 0.05 0.05"
      animation-mixer>
    </a-entity>

  </a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');
const scene = document.querySelector('a-scene');

const modelsContainer = document.getElementById('modelsContainer');
const leftModel = document.getElementById('leftModel');
const rightModel = document.getElementById('rightModel');
const music = document.getElementById('music');

let mindar = null;
let targetEntity = null;

// Создаем временный маркер, чтобы получить позицию
function createTargetTracker() {
  targetEntity = document.createElement('a-entity');
  targetEntity.setAttribute('mindar-image-target', 'targetIndex:0'); // первый маркер
  targetEntity.setAttribute('visible', false); // скрываем сам маркер
  scene.appendChild(targetEntity);
}
createTargetTracker();

// Функция обновления позиции моделей каждые 5 секунд
function updateModelPositions() {
  if(!targetEntity) return;
  const worldPos = new THREE.Vector3();
  targetEntity.object3D.getWorldPosition(worldPos);

  // Обновляем позицию контейнера моделей
  modelsContainer.object3D.position.copy(worldPos);
}

// Старт AR
startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startScreen.style.display = 'none';
  status.style.display = 'block';

  try {
    mindar = scene.systems['mindar-image-system'];
    await mindar.start();

    // Показываем модели
    modelsContainer.setAttribute('visible', true);

    // Запускаем анимацию моделей после загрузки
    [leftModel, rightModel].forEach(model => {
      model.addEventListener('model-loaded', () => {
        if(model.components['animation-mixer']){
          model.components['animation-mixer'].play();
        }
      });
    });

    // Каждые 5 секунд обновляем позицию моделей
    setInterval(updateModelPositions, 5000);

    // Включаем музыку
    music.components.sound.playSound();

    // Слушаем событие обнаружения маркера для статуса
    targetEntity.addEventListener('targetFound', () => status.textContent = 'Маркер найден');
    targetEntity.addEventListener('targetLost', () => status.textContent = 'Наведи камеру на маркер');

  } catch(e) {
    alert('Камера недоступна или отказано в доступе. Обновите страницу и попробуйте снова.');
    console.error(e);
  }
});
</script>

</body>
</html>
