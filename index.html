<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AR — Статичные модели с анимацией</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>
html, body {
  margin: 0; width: 100%; height: 100%; overflow: hidden
}
</style>
</head>
<body>

<a-scene embedded
        vr-mode-ui="enabled:false"
        renderer="alpha:true"
        arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-entity camera look-controls="enabled:false">

    <a-entity id="hud" position="0 0 -2">

      <!-- Левая модель -->
      <a-entity
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
        position="-0.3 -0.4 0"
        scale="0.05 0.05 0.05"
        animation-mixer>
      </a-entity>

      <!-- Правая модель -->
      <a-entity
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
        position="0.3 -0.4 0"
        scale="0.05 0.05 0.05"
        animation-mixer>
      </a-entity>

    </a-entity>

  </a-entity>

</a-scene>

</body>
</html>
