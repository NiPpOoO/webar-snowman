<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 4</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
}
#status {
  position:fixed; bottom:12px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  color:#fff; padding:8px 12px;
  border-radius:6px; z-index:11;
  display:none;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay: false; loop: true; volume: 0.5"></a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');
const scene = document.querySelector('a-scene');

const markersCount = 6;

// Компонент для сглаживания дрожания модели с медианным фильтром
AFRAME.registerComponent('soft-stabilizer', {
  schema: {
    smoothing: { default: 0.03 },      // Очень сильное сглаживание
    updateInterval: { default: 300 },  // Большой интервал обновления (300мс)
    lockY: { default: true },          // Фиксировать вертикальную ось
    lockRot: { default: true }        // Блокировать повороты полностью
  },
  init() {
    this.isVisible = false;
    this.initialY = null;
    
    // Буферы для сглаживания
    this.smoothPos = new THREE.Vector3();
    
    // История позиций для медианного фильтра (убирает выбросы)
    this.positionHistory = [];
    this.historySize = 5;
    
    // Флаг инициализации
    this.initialized = false;
    
    // Время последнего обновления позиции
    this.lastUpdateTime = 0;
  },
  tick(time) {
    const parent = this.el.parentEl;
    if (!parent) return;

    const src = parent.object3D;
    const dst = this.el.object3D;

    // Проверяем видимость маркера
    const markerVisible = parent.getAttribute('visible') !== false;
    
    if (!markerVisible) {
      this.el.setAttribute('visible', false);
      this.isVisible = false;
      this.initialized = false;
      this.initialY = null;
      this.positionHistory = [];
      this.lastUpdateTime = 0;
      return;
    }

    // Инициализация при первом появлении маркера
    if (!this.initialized) {
      this.initialY = src.position.y;
      this.smoothPos.copy(src.position);
      dst.position.copy(src.position);
      // Инициализируем историю одинаковыми значениями
      for (let i = 0; i < this.historySize; i++) {
        this.positionHistory.push(src.position.clone());
      }
      this.initialized = true;
      this.lastUpdateTime = time;
      
      if (!this.isVisible) {
        this.el.setAttribute('visible', true);
        this.isVisible = true;
      }
      return;
    }

    // Обновляем позицию только если прошло достаточно времени
    const timeSinceLastUpdate = time - this.lastUpdateTime;
    if (timeSinceLastUpdate >= this.data.updateInterval) {
      // Создаем целевую позицию с фиксацией Y
      const targetPos = new THREE.Vector3(
        src.position.x,
        this.data.lockY ? this.initialY : src.position.y,
        src.position.z
      );

      // Добавляем в историю и удаляем старые значения
      this.positionHistory.push(targetPos.clone());
      if (this.positionHistory.length > this.historySize) {
        this.positionHistory.shift();
      }

      // Вычисляем медианное значение по каждой оси (убирает выбросы)
      const sortedX = this.positionHistory.map(p => p.x).sort((a, b) => a - b);
      const sortedY = this.positionHistory.map(p => p.y).sort((a, b) => a - b);
      const sortedZ = this.positionHistory.map(p => p.z).sort((a, b) => a - b);
      const medianIndex = Math.floor(sortedX.length / 2);
      
      const medianPos = new THREE.Vector3(
        sortedX[medianIndex],
        sortedY[medianIndex],
        sortedZ[medianIndex]
      );

      // Применяем сглаживание к медианной позиции
      this.smoothPos.lerp(medianPos, this.data.smoothing);
      dst.position.lerp(this.smoothPos, this.data.smoothing);

      // Обновляем время последнего обновления
      this.lastUpdateTime = time;
    }

    // Показываем контент
    if (!this.isVisible) {
      this.el.setAttribute('visible', true);
      this.isVisible = true;
    }
  }
});

// Компонент для поворота модели к камере (только по оси Y)
AFRAME.registerComponent('look-at-camera', {
  schema: {
    enabled: { default: true },
    smoothing: { default: 0.1 }
  },
  init() {
    this.camera = null;
    this.targetRotation = new THREE.Euler();
  },
  tick() {
    if (!this.data.enabled) return;
    
    // Находим камеру
    if (!this.camera) {
      this.camera = document.querySelector('a-camera');
      if (!this.camera) return;
    }

    const cameraPos = this.camera.object3D.getWorldPosition(new THREE.Vector3());
    const modelPos = this.el.object3D.getWorldPosition(new THREE.Vector3());
    
    // Вычисляем направление к камере в горизонтальной плоскости
    const direction = new THREE.Vector3();
    direction.x = cameraPos.x - modelPos.x;
    direction.z = cameraPos.z - modelPos.z;
    direction.normalize();
    
    // Вычисляем угол поворота только по оси Y
    const angleY = Math.atan2(direction.x, direction.z);
    
    // Получаем текущую ротацию
    const currentRotation = this.el.object3D.rotation.y;
    
    // Вычисляем разницу углов и нормализуем в диапазон [-PI, PI]
    let targetY = angleY;
    let diff = targetY - currentRotation;
    
    // Нормализуем разницу
    while (diff > Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    
    // Применяем сглаживание
    const newY = currentRotation + diff * this.data.smoothing;
    this.el.object3D.rotation.y = newY;
  }
});

// Функция создания маркера с моделями
function createMarker(index) {
  const marker = document.createElement('a-entity');
  marker.setAttribute('mindar-image-target', `targetIndex:${index}`);
  scene.appendChild(marker);

  // Контейнер моделей с сглаживанием
  const content = document.createElement('a-entity');
  content.setAttribute('position','0 0 0');
  content.setAttribute('soft-stabilizer','lockRot: true; lockY: true; smoothing: 0.03; updateInterval: 300');

  // Модель слева
  const leftWrapper = document.createElement('a-entity');
  leftWrapper.setAttribute('position','-0.5 -0.5 0');
  leftWrapper.setAttribute('visible','true');
  const leftModel = document.createElement('a-entity');
  leftModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox.glb');
  leftModel.setAttribute('scale','0.05 0.05 0.05');
  leftModel.setAttribute('visible','true');
  leftModel.setAttribute('animation-mixer','clip:*; loop:repeat');
  leftModel.setAttribute('look-at-camera','smoothing: 0.1');
  leftWrapper.appendChild(leftModel);
  content.appendChild(leftWrapper);

  // Модель справа
  const rightWrapper = document.createElement('a-entity');
  rightWrapper.setAttribute('position','0.5 -0.5 0');
  rightWrapper.setAttribute('visible','true');
  const rightModel = document.createElement('a-entity');
  rightModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb');
  rightModel.setAttribute('scale','0.05 0.05 0.05');
  rightModel.setAttribute('visible','true');
  rightModel.setAttribute('animation-mixer','clip:*; loop:repeat');
  rightModel.setAttribute('look-at-camera','smoothing: 0.1');
  rightWrapper.appendChild(rightModel);
  content.appendChild(rightWrapper);

  marker.appendChild(content);
  
  // Отладка: проверяем количество дочерних элементов
  console.log(`Маркер ${index}: создано моделей в content:`, content.children.length);

  marker.addEventListener('targetFound', ()=>{
    marker.setAttribute('visible', true);
    content.setAttribute('visible', true);
    // Убеждаемся, что обе модели видны
    leftWrapper.setAttribute('visible', true);
    rightWrapper.setAttribute('visible', true);
    leftModel.setAttribute('visible', true);
    rightModel.setAttribute('visible', true);
    status.textContent = `Маркер ${index} найден`;
  });

  marker.addEventListener('targetLost', ()=>{
    marker.setAttribute('visible', false);
    content.setAttribute('visible', false);
    status.textContent = 'Наведи камеру на маркер';
  });

  return marker;
}

// Создаем маркеры
for(let i=0;i<markersCount;i++){
  createMarker(i);
}

// Старт AR и музыки по кнопке
startBtn.addEventListener('click', async ()=>{
  startBtn.disabled = true;
  startScreen.style.display='none';
  status.style.display='block';
  try {
    const mindar = scene.systems['mindar-image-system'];
    await mindar.start();
    const music = document.getElementById('music');
    music.components.sound.playSound();
  } catch(e){
    alert('Камера недоступна или отказано в доступе. Обновите страницу и попробуйте снова.');
    console.error(e);
  }
});
</script>

</body>
</html>
