<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>WebAR Snowman — MindAR Stable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

  <!-- A-Frame (совместимая версия) -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin:0; overflow:hidden; font-family:system-ui,sans-serif; }
    #status { position:absolute; top:10px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,0.65); color:#fff; padding:8px 12px; border-radius:6px; font-size:14px; }
  </style>
</head>
<body>

<div id="status">Наведи камеру на снеговика</div>

<a-scene
  mindar-image="imageTargetSrc: assets/targets/snowman.mind"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: true"
  renderer="colorManagement: true"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- Маркер снеговика -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-box position="-0.4 0 0" scale="0.3 0.3 0.3" color="#ff6600"></a-box>
    <a-sphere position="0.4 0 0" scale="0.25 0.25 0.25" color="#ffffff"></a-sphere>
  </a-entity>
</a-scene>

</body>
</html>
