<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 106</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- animation-mixer -->
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
#status {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.6);
  color: #fff;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 14px;
  z-index: 10;
}
</style>
</head>

<body>

<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="alpha: true">

  <a-camera look-controls="enabled: false"></a-camera>

  <!-- ОБЩИЙ КОНТЕЙНЕР С ОБЪЕКТАМИ -->
  <a-entity id="content-root" visible="false">

    <!-- СНЕГОВИК -->
    <a-entity position="-0.3 -0.3 0">
      <a-entity
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
        scale="0.3 0.3 0.3"
        animation-mixer="clip: *; loop: repeat">
      </a-entity>
    </a-entity>

    <!-- ВТОРАЯ МОДЕЛЬ СПРАВА -->
    <a-entity position="0.3 -0.3 0">
      <a-entity
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
        scale="0.25 0.25 0.25"
        animation-mixer="clip: *; loop: repeat">
      </a-entity>
    </a-entity>

  </a-entity>

  <!-- 6 МАРКЕРОВ (РАЗНЫЕ СТОРОНЫ ОДНОГО ОБЪЕКТА) -->
  <a-entity mindar-image-target="targetIndex: 0" class="marker"></a-entity>
  <a-entity mindar-image-target="targetIndex: 1" class="marker"></a-entity>
  <a-entity mindar-image-target="targetIndex: 2" class="marker"></a-entity>
  <a-entity mindar-image-target="targetIndex: 3" class="marker"></a-entity>
  <a-entity mindar-image-target="targetIndex: 4" class="marker"></a-entity>
  <a-entity mindar-image-target="targetIndex: 5" class="marker"></a-entity>

</a-scene>

<script>
const status = document.getElementById('status');
const content = document.getElementById('content-root');
const markers = document.querySelectorAll('.marker');

let activeMarker = null;

// сглаживание
AFRAME.registerComponent('smooth-follow', {
  tick() {
    if (!activeMarker) return;

    const src = activeMarker.object3D;
    const dst = content.object3D;

    dst.position.lerp(src.position, 0.15);
    dst.quaternion.slerp(src.quaternion, 0.15);
  }
});

content.setAttribute('smooth-follow', '');

markers.forEach(marker => {
  marker.addEventListener('targetFound', () => {
    activeMarker = marker;
    content.setAttribute('visible', true);
    status.textContent = 'Маркер найден';
  });

  marker.addEventListener('targetLost', () => {
    // не скрываем сразу — ждём следующий
    setTimeout(() => {
      if (activeMarker === marker) {
        activeMarker = null;
        content.setAttribute('visible', false);
        status.textContent = 'Наведи камеру на маркер';
      }
    }, 200);
  });
});
</script>

</body>
</html>
