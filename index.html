<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — модели + координаты маркера</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
}
#status {
  position:fixed; bottom:12px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  color:#fff; padding:8px 12px;
  border-radius:6px; z-index:11;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true">

  <a-camera look-controls="enabled:true"></a-camera>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay: false; loop: true; volume: 0.5"></a-entity>

  <!-- Контейнер моделей — всегда на экране -->
  <a-entity id="modelsContainer" position="0 0 -2">

    <a-entity
      gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
      position="-0.5 -0.5 0"
      scale="0.05 0.05 0.05"
      animation-mixer="clip:*; loop:repeat">
    </a-entity>

    <a-entity
      gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
      position="0.5 -0.5 0"
      scale="0.05 0.05 0.05"
      animation-mixer="clip:*; loop:repeat">
    </a-entity>

  </a-entity>

  <!-- Скрытый маркер для отслеживания координат -->
  <a-entity id="markerTracker" mindar-image-target="targetIndex:0" visible="false"></a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');
const markerTracker = document.getElementById('markerTracker');

let markerPosition = new THREE.Vector3(); // координаты маркера

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startScreen.style.display = 'none';

  const scene = document.querySelector('a-scene');
  const mindar = scene.systems['mindar-image-system'];
  await mindar.start();

  const music = document.getElementById('music');
  music.components.sound.playSound();

  // Обновляем координаты маркера каждую рамку
  scene.addEventListener('frame', () => {
    if(markerTracker.object3D){
      markerTracker.object3D.getWorldPosition(markerPosition);
      // markerPosition.x/y/z теперь доступны в переменной
      // Например, двигаем модели немного в зависимости от маркера
      const modelsContainer = document.getElementById('modelsContainer');
      modelsContainer.object3D.position.set(
        0 + markerPosition.x * 0.1,
        0 + markerPosition.y * 0.1,
        -2 + markerPosition.z * 0.1
      );
    }
  });

  // События для статуса
  markerTracker.addEventListener('targetFound', () => {
    status.textContent = 'Маркер найден';
  });
  markerTracker.addEventListener('targetLost', () => {
    status.textContent = 'Наведи камеру на маркер';
  });
});
</script>

</body>
</html>
