<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MindAR — 105</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- A-Frame Extras (animation-mixer !!!) -->
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
</style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="alpha: true">

  <a-camera look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-entity position="-0.3 -0.3 0">

      <a-entity
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
        scale="0.3 0.3 0.3"
        animation-mixer="clip: *; loop: repeat">
      </a-entity>

    </a-entity>

  </a-entity>

</a-scene>

</body>
</html>
