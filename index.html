<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 10</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

<!-- MindAR CORE -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>

<!-- MindAR A-Frame adapter -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

a-scene {
  position: fixed !important;
  top: 0;
  left: 0;
  width: 100vw !important;
  height: 100vh !important;
  z-index: 2;
  background: transparent !important;
}

video, canvas {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  object-fit: cover !important;
  z-index: 1;
  background: transparent !important;
}

/* START SCREEN */
#start {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  background: #000;
}

#start button {
  padding: 14px 22px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
}

/* UI */
#ui {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 20;
}

#ui button {
  background: rgba(0,0,0,0.65);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.3);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 14px;
}

#status {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.65);
  color: #fff;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 14px;
  z-index: 20;
}
</style>
</head>

<body>

<!-- START -->
<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>

<!-- UI -->
<div id="ui" style="display:none">
  <button id="btnCamera">Сменить камеру</button>
  <button id="btnModel">Сменить модель</button>
</div>

<div id="status" style="display:none">Наведи камеру на маркер</div>

<!-- SCENE -->
<a-scene
  id="scene"
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart: false"
  vr-mode-ui="enabled:false"
  renderer="alpha: true"
  background="color: transparent"
>
  <a-camera look-controls="enabled:false"></a-camera>

  <!-- TARGET -->
  <a-entity id="target" mindar-image-target="targetIndex:0">
    <!-- MODEL 1 -->
    <a-entity id="model1" visible="true">
      <a-sphere position="0 0.15 0" radius="0.15" color="#ffffff"></a-sphere>
      <a-sphere position="0 -0.1 0" radius="0.22" color="#ffffff"></a-sphere>
    </a-entity>

    <!-- MODEL 2 -->
    <a-entity id="model2" visible="false">
      <a-box position="0 0 0" width="0.3" height="0.3" depth="0.3" color="#ff6600"></a-box>
    </a-entity>
  </a-entity>
</a-scene>

<script>
(() => {
  const startBtn = document.getElementById('startBtn');
  const startScreen = document.getElementById('start');
  const ui = document.getElementById('ui');
  const status = document.getElementById('status');

  const btnCamera = document.getElementById('btnCamera');
  const btnModel = document.getElementById('btnModel');

  const scene = document.getElementById('scene');
  const target = document.getElementById('target');
  const model1 = document.getElementById('model1');
  const model2 = document.getElementById('model2');

  let facingMode = 'environment';
  let currentModel = 1;

  // START AR
  async function startAR(facing) {
    startScreen.style.display = 'none';
    ui.style.display = 'flex';
    status.style.display = 'block';

    const mindarSystem = scene.systems['mindar-image-system'];
    await mindarSystem.start({ facingMode: facing });

    // Видео камеры на весь экран через небольшой timeout
    setTimeout(() => {
      const videoEl = document.querySelector('video');
      if(videoEl){
        videoEl.style.width = '100vw';
        videoEl.style.height = '100vh';
        videoEl.style.objectFit = 'cover';
      }
    }, 500);
  }

  startBtn.addEventListener('click', () => startAR('environment'));

  // CAMERA SWITCH
  btnCamera.addEventListener('click', async () => {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    const mindarSystem = scene.systems['mindar-image-system'];
    await mindarSystem.stop();
    await startAR(facingMode);
  });

  // MODEL SWITCH
  btnModel.addEventListener('click', () => {
    currentModel = currentModel === 1 ? 2 : 1;
    model1.setAttribute('visible', currentModel === 1);
    model2.setAttribute('visible', currentModel === 2);
  });

  // TARGET EVENTS
  target.addEventListener('targetFound', () => {
    status.textContent = 'Маркер найден';
  });

  target.addEventListener('targetLost', () => {
    status.textContent = 'Наведи камеру на маркер';
  });
})();
</script>

</body>
</html>
