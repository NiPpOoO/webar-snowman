<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 3111</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- A-Frame -->
<script src="https://unpkg.com/aframe@1.4.2/dist/aframe-master.min.js"></script>
<script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR Image Tracking - максимальная совместимость со всеми браузерами -->
<script src="https://unpkg.com/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://unpkg.com/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; touch-action:none; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
#start button:active {
  opacity:0.8;
}
#status {
  position:fixed; bottom:12px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  color:#fff; padding:8px 12px;
  border-radius:6px; z-index:11;
  display:none;
  font-size:14px;
  text-align:center;
  max-width:90%;
  pointer-events:none;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true; antialias:true; colorManagement:true; sortObjects:true;">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay: false; loop: true; volume: 0.5"></a-entity>

</a-scene>

<script>
// Проверка совместимости браузера
function checkBrowserCompatibility() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isAndroid = /Android/.test(navigator.userAgent);
  const isChrome = /Chrome/.test(navigator.userAgent);
  const isSafari = /Safari/.test(navigator.userAgent) && !isChrome;
  const isFirefox = /Firefox/.test(navigator.userAgent);
  
  // Проверка поддержки необходимых API
  const hasGetUserMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const hasWebGL = !!document.createElement('canvas').getContext('webgl');
  
  if (!hasGetUserMedia) {
    return { compatible: false, reason: 'Ваш браузер не поддерживает доступ к камере. Используйте Chrome, Safari или Firefox.' };
  }
  
  if (!hasWebGL) {
    return { compatible: false, reason: 'Ваш браузер не поддерживает WebGL. Обновите браузер.' };
  }
  
  // Предупреждения для специфичных браузеров
  if (isIOS && isSafari) {
    // Safari на iOS работает хорошо
    return { compatible: true, browser: 'Safari iOS' };
  } else if (isAndroid && isChrome) {
    // Chrome на Android работает хорошо
    return { compatible: true, browser: 'Chrome Android' };
  } else if (isFirefox) {
    return { compatible: true, browser: 'Firefox' };
  }
  
  return { compatible: true, browser: 'Unknown' };
}

const compatibility = checkBrowserCompatibility();
if (!compatibility.compatible) {
  console.warn('Совместимость:', compatibility.reason);
}

const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');
const scene = document.querySelector('a-scene');

// Конфигурация: 7 снеговиков, по 3 маркера на каждого (итого 21 маркер)
const snowmenCount = 7;
const markersPerSnowman = 3;
const totalMarkers = snowmenCount * markersPerSnowman; // 21

// Компонент для плавной стабилизации моделей с фильтрацией
AFRAME.registerComponent('model-stabilizer', {
  schema: {
    smoothing: { default: 0.15 },        // Коэффициент сглаживания позиции (0-1, меньше = плавнее)
    rotationSmoothing: { default: 0.2 }, // Коэффициент сглаживания ротации
    minMoveDistance: { default: 0.05 },  // Минимальное расстояние для обновления позиции
    updateInterval: { default: 16 }      // Интервал обновления (мс, ~60fps)
  },
  init() {
    this.initialized = false;
    this.smoothedPosition = new THREE.Vector3(0, 0, 0);
    this.smoothedQuaternion = new THREE.Quaternion(0, 0, 0, 1);
    this.targetPosition = new THREE.Vector3(0, 0, 0);
    this.targetQuaternion = new THREE.Quaternion(0, 0, 0, 1);
    
    // Для медианной фильтрации
    this.positionHistory = [];
    this.rotationHistory = [];
    this.historySize = 5;
    this.lastUpdateTime = 0;
  },
  tick(time) {
    const dst = this.el.object3D;
    const parent = this.el.parentEl;
    
    if (!parent || !parent.object3D) return;
    
    const markerVisible = parent.getAttribute('visible') !== false;
    const currentTime = time || performance.now();
    const deltaTime = Math.min((currentTime - this.lastUpdateTime) / 1000, 0.1); // Ограничиваем deltaTime
    
    if (!markerVisible) {
      if (this.initialized) {
        // Сбрасываем при потере маркера
        this.initialized = false;
        this.positionHistory = [];
        this.rotationHistory = [];
      }
      return;
    }
    
    // Инициализация при первом обнаружении
    if (!this.initialized) {
      dst.position.set(0, 0, 0);
      dst.quaternion.set(0, 0, 0, 1);
      this.smoothedPosition.set(0, 0, 0);
      this.smoothedQuaternion.set(0, 0, 0, 1);
      this.targetPosition.set(0, 0, 0);
      this.targetQuaternion.set(0, 0, 0, 1);
      this.initialized = true;
    }
    
    // Обновляем с интервалом для оптимизации
    if (currentTime - this.lastUpdateTime < this.data.updateInterval) {
      // Применяем сглаженную позицию каждый кадр для плавности
      dst.position.copy(this.smoothedPosition);
      dst.quaternion.copy(this.smoothedQuaternion);
      dst.updateMatrix();
      return;
    }
    
    this.lastUpdateTime = currentTime;
    
    // Получаем текущую позицию от маркера (всегда 0,0,0 относительно маркера)
    const currentPos = new THREE.Vector3(0, 0, 0);
    const currentRot = new THREE.Quaternion(0, 0, 0, 1);
    
    // Добавляем в историю для медианной фильтрации
    this.positionHistory.push(currentPos.clone());
    this.rotationHistory.push(currentRot.clone());
    
    if (this.positionHistory.length > this.historySize) {
      this.positionHistory.shift();
      this.rotationHistory.shift();
    }
    
    // Вычисляем медианную позицию для фильтрации выбросов
    if (this.positionHistory.length >= 3) {
      const positions = this.positionHistory.map(p => p.clone());
      const sortedX = positions.map(p => p.x).sort((a, b) => a - b);
      const sortedY = positions.map(p => p.y).sort((a, b) => a - b);
      const sortedZ = positions.map(p => p.z).sort((a, b) => a - b);
      
      const medianPos = new THREE.Vector3(
        sortedX[Math.floor(sortedX.length / 2)],
        sortedY[Math.floor(sortedY.length / 2)],
        sortedZ[Math.floor(sortedZ.length / 2)]
      );
      
      // Проверяем расстояние до текущей сглаженной позиции
      const distance = this.smoothedPosition.distanceTo(medianPos);
      
      // Обновляем целевую позицию только если изменение значительное
      if (distance > this.data.minMoveDistance) {
        this.targetPosition.copy(medianPos);
      }
      
      // Плавная интерполяция позиции (lerp)
      this.smoothedPosition.lerp(this.targetPosition, this.data.smoothing);
      
      // Плавная интерполяция ротации (slerp)
      const rotations = this.rotationHistory.map(r => r.clone());
      // Используем последнюю ротацию (медианная для ротации сложнее)
      if (rotations.length > 0) {
        this.targetQuaternion.copy(rotations[rotations.length - 1]);
      }
      this.smoothedQuaternion.slerp(this.targetQuaternion, this.data.rotationSmoothing);
    } else {
      // Пока недостаточно данных - используем текущие значения
      this.targetPosition.copy(currentPos);
      this.targetQuaternion.copy(currentRot);
      this.smoothedPosition.lerp(this.targetPosition, this.data.smoothing);
      this.smoothedQuaternion.slerp(this.targetQuaternion, this.data.rotationSmoothing);
    }
    
    // Применяем сглаженную позицию и ротацию
    dst.position.copy(this.smoothedPosition);
    dst.quaternion.copy(this.smoothedQuaternion);
    
    // Фиксируем масштаб
    dst.scale.set(1, 1, 1);
    
    // Обновляем матрицу
    dst.updateMatrix();
  }
});

// Создаем группы маркеров для каждого снеговика
const markerGroups = [];

for (let snowmanIndex = 0; snowmanIndex < snowmenCount; snowmanIndex++) {
  const group = {
    snowmanIndex: snowmanIndex,
    markers: [],
    content: null,
    activeMarker: null,
    contentEntity: null
  };
  
  // Создаем общий контейнер для моделей этого снеговика
  const content = document.createElement('a-entity');
  content.setAttribute('position', '0 0 0');
  content.setAttribute('visible', false);
  content.setAttribute('model-stabilizer', 'smoothing: 0.12; rotationSmoothing: 0.18; minMoveDistance: 0.03; updateInterval: 16');
  
  // Модель слева
  const leftWrapper = document.createElement('a-entity');
  leftWrapper.setAttribute('position', '-0.3 0 0');
  const leftModel = document.createElement('a-entity');
  leftModel.setAttribute('gltf-model', 'https://nippooo.github.io/webar-snowman/assets/models/Fox.glb');
  leftModel.setAttribute('scale', '0.05 0.05 0.05');
  leftModel.setAttribute('animation-mixer', 'clip:*; loop:repeat');
  leftWrapper.appendChild(leftModel);
  content.appendChild(leftWrapper);
  
  // Модель справа
  const rightWrapper = document.createElement('a-entity');
  rightWrapper.setAttribute('position', '0.3 0 0');
  const rightModel = document.createElement('a-entity');
  rightModel.setAttribute('gltf-model', 'https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb');
  rightModel.setAttribute('scale', '0.05 0.05 0.05');
  rightModel.setAttribute('animation-mixer', 'clip:*; loop:repeat');
  rightWrapper.appendChild(rightModel);
  content.appendChild(rightWrapper);
  
  group.contentEntity = content;
  
  // Создаем 3 маркера для этого снеговика
  for (let markerOffset = 0; markerOffset < markersPerSnowman; markerOffset++) {
    const markerIndex = snowmanIndex * markersPerSnowman + markerOffset;
    
    const marker = document.createElement('a-entity');
    marker.setAttribute('mindar-image-target', `targetIndex:${markerIndex}`);
    marker.setAttribute('visible', false);
    scene.appendChild(marker);
    
    group.markers.push(marker);
    
    // Обработчики событий для маркера
    marker.addEventListener('targetFound', () => {
      // Если контейнер уже прикреплен к другому маркеру, открепляем его
      if (group.contentEntity.parentNode && group.contentEntity.parentNode !== marker) {
        group.contentEntity.parentNode.removeChild(group.contentEntity);
      }
      
      // Если контейнер еще не прикреплен, добавляем к текущему маркеру
      if (!group.contentEntity.parentNode) {
        marker.appendChild(group.contentEntity);
      }
      
      group.activeMarker = marker;
      group.contentEntity.setAttribute('visible', true);
      status.textContent = `Снеговик ${snowmanIndex + 1} найден`;
    });
    
    marker.addEventListener('targetLost', () => {
      // Проверяем, что это текущий активный маркер
      if (group.activeMarker === marker) {
        setTimeout(() => {
          // Проверяем, не стал ли активным другой маркер из группы
          let otherActive = false;
          for (const m of group.markers) {
            if (m !== marker && m.getAttribute('visible') !== false) {
              otherActive = true;
              // Перемещаем контейнер к новому активному маркеру
              if (group.contentEntity.parentNode) {
                group.contentEntity.parentNode.removeChild(group.contentEntity);
              }
              m.appendChild(group.contentEntity);
              group.activeMarker = m;
              break;
            }
          }
          
          if (!otherActive) {
            group.contentEntity.setAttribute('visible', false);
            group.activeMarker = null;
            status.textContent = 'Наведи камеру на маркер';
          }
        }, 200);
      }
    });
  }
  
  group.content = content;
  markerGroups.push(group);
}

// Старт AR и музыки по кнопке
startBtn.addEventListener('click', async () => {
  // Предотвращаем множественные клики
  if (startBtn.disabled) return;
  
  startBtn.disabled = true;
  startBtn.style.opacity = '0.6';
  startScreen.style.display = 'none';
  status.style.display = 'block';
  status.textContent = 'Запуск...';
  
  try {
    // Ждём, пока сцена полностью загрузится
    if (!scene.hasLoaded) {
      await new Promise(resolve =>
        scene.addEventListener('loaded', resolve, { once: true })
      );
    }
    
    status.textContent = 'Инициализация камеры...';
    
    // Проверяем наличие системы MindAR
    const mindar = scene.systems['mindar-image-system'];
    if (!mindar) {
      throw new Error('MindAR система не найдена. Убедитесь, что скрипты загружены.');
    }
    
    await mindar.start();
    
    status.textContent = 'Наведи камеру на маркер';
    
    // Запускаем музыку
    const music = document.getElementById('music');
    if (music && music.components && music.components.sound) {
      music.components.sound.playSound();
    } else {
      console.warn('Компонент звука не найден или еще не загружен');
    }
  } catch(e) {
    console.error('Ошибка запуска AR:', e);
    
    // Более информативные сообщения об ошибках
    let errorMessage = 'Ошибка при запуске AR. ';
    if (e.name === 'NotAllowedError' || e.message.includes('permission')) {
      errorMessage += 'Разрешите доступ к камере в настройках браузера.';
    } else if (e.name === 'NotFoundError' || e.message.includes('camera')) {
      errorMessage += 'Камера не найдена. Убедитесь, что устройство имеет камеру.';
    } else if (e.message.includes('MindAR')) {
      errorMessage += 'Проблема с загрузкой AR библиотеки. Проверьте интернет-соединение.';
    } else {
      errorMessage += e.message || 'Попробуйте обновить страницу.';
    }
    
    alert(errorMessage);
    
    // Восстанавливаем UI при ошибке
    startBtn.disabled = false;
    startBtn.style.opacity = '1';
    startScreen.style.display = 'flex';
    status.style.display = 'none';
  }
});

// Улучшенная обработка касаний для мобильных устройств
let touchHandled = false;
startBtn.addEventListener('touchstart', (e) => {
  if (!touchHandled) {
    touchHandled = true;
    e.preventDefault();
    startBtn.click();
    setTimeout(() => { touchHandled = false; }, 300);
  }
}, { passive: false });

// Дополнительная обработка для всех типов событий
startBtn.addEventListener('mousedown', (e) => {
  e.preventDefault();
});

// Убеждаемся, что кнопка кликабельна
startBtn.style.pointerEvents = 'auto';
startBtn.style.userSelect = 'none';
startBtn.style.webkitUserSelect = 'none';
</script>
</body>
</html>
