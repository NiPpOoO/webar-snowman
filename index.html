<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
}
#status {
  position:fixed; bottom:12px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  color:#fff; padding:8px 12px;
  border-radius:6px; z-index:11;
  display:none;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay: false; loop: true; volume: 0.5"></a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');
const scene = document.querySelector('a-scene');

const markersCount = 6;

// Компонент для сглаживания дрожания модели с агрессивной фильтрацией шума
AFRAME.registerComponent('soft-stabilizer', {
  schema: {
    pos: { default: 0.05 },  // Очень сильное сглаживание позиции
    rot: { default: 0.05 },  // Очень сильное сглаживание ротации
    minMove: { default: 0.01 },  // Большой порог для обновления позиции (фильтрация микро-дрожания)
    minRot: { default: 0.02 },   // Большой порог для обновления ротации (предотвращает повороты)
    lockY: { default: true }      // Фиксировать вертикальную ось
  },
  init() {
    // Сохраняем предыдущие значения для проверки изменений
    this.lastPos = new THREE.Vector3();
    this.lastRot = new THREE.Quaternion();
    this.isVisible = false;
    this.initialY = null;
  },
  tick() {
    const parent = this.el.parentEl;
    if (!parent) return;

    const src = parent.object3D;
    const dst = this.el.object3D;

    // Проверяем, видим ли маркер
    const markerVisible = parent.getAttribute('visible') !== false;
    
    if (!markerVisible) {
      this.el.setAttribute('visible', false);
      this.isVisible = false;
      this.initialY = null;
      return;
    }

    // Сохраняем начальную Y позицию при первом появлении
    if (this.initialY === null) {
      this.initialY = src.position.y;
      this.lastPos.copy(src.position);
      this.lastRot.copy(src.quaternion);
    }

    // Вычисляем изменения по каждой оси отдельно
    const posDeltaX = Math.abs(src.position.x - this.lastPos.x);
    const posDeltaY = Math.abs(src.position.y - this.lastPos.y);
    const posDeltaZ = Math.abs(src.position.z - this.lastPos.z);
    const posDelta = src.position.distanceTo(this.lastPos);
    
    const rotDelta = src.quaternion.angleTo(this.lastRot);

    // Применяем очень агрессивное сглаживание позиции
    if (posDelta > this.data.minMove) {
      // Создаем целевую позицию с фиксацией Y
      const targetPos = new THREE.Vector3(
        src.position.x,
        this.data.lockY ? this.initialY : src.position.y,
        src.position.z
      );
      
      // Используем lerp для плавного перехода
      dst.position.lerp(targetPos, this.data.pos);
      this.lastPos.copy(dst.position);
    } else {
      // Игнорируем микро-изменения - оставляем позицию как есть
      dst.position.copy(this.lastPos);
    }

    // Очень агрессивное сглаживание ротации с большим порогом
    if (rotDelta > this.data.minRot) {
      dst.quaternion.slerp(src.quaternion, this.data.rot);
      this.lastRot.copy(dst.quaternion);
    } else {
      // Игнорируем микро-повороты - оставляем ротацию как есть
      dst.quaternion.copy(this.lastRot);
    }

    // Показываем контент только если маркер виден
    if (!this.isVisible) {
      this.el.setAttribute('visible', true);
      this.isVisible = true;
    }
  }
});

// Функция создания маркера с моделями
function createMarker(index) {
  const marker = document.createElement('a-entity');
  marker.setAttribute('mindar-image-target', `targetIndex:${index}`);
  scene.appendChild(marker);

  // Контейнер моделей с сглаживанием
  const content = document.createElement('a-entity');
  content.setAttribute('position','0 0 0');
  content.setAttribute('soft-stabilizer','');

  // Модель слев
  const leftWrapper = document.createElement('a-entity');
  leftWrapper.setAttribute('position','-0.5 -0.5 0');
  const leftModel = document.createElement('a-entity');
  leftModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox.glb');
  leftModel.setAttribute('scale','0.05 0.05 0.05');
  leftModel.setAttribute('animation-mixer','clip:*; loop:repeat');
  leftWrapper.appendChild(leftModel);
  content.appendChild(leftWrapper);

  // Модель справа
  const rightWrapper = document.createElement('a-entity');
  rightWrapper.setAttribute('position','0.5 -0.5 0');
  const rightModel = document.createElement('a-entity');
  rightModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb');
  rightModel.setAttribute('scale','0.05 0.05 0.05');
  rightModel.setAttribute('animation-mixer','clip:*; loop:repeat');
  rightWrapper.appendChild(rightModel);
  content.appendChild(rightWrapper);

  marker.appendChild(content);

  marker.addEventListener('targetFound', ()=>{
    marker.setAttribute('visible', true);
    content.setAttribute('visible', true);
    status.textContent = 'Маркер найден';
  });

  marker.addEventListener('targetLost', ()=>{
    marker.setAttribute('visible', false);
    content.setAttribute('visible', false);
    status.textContent = 'Наведи камеру на маркер';
  });

  return marker;
}

// Создаем маркеры
for(let i=0;i<markersCount;i++){
  createMarker(i);
}

// Старт AR и музыки по кнопке
startBtn.addEventListener('click', async ()=>{
  startBtn.disabled = true;
  startScreen.style.display='none';
  status.style.display='block';
  try {
    const mindar = scene.systems['mindar-image-system'];
    await mindar.start();
    const music = document.getElementById('music');
    music.components.sound.playSound();
  } catch(e){
    alert('Камера недоступна или отказано в доступе. Обновите страницу и попробуйте снова.');
    console.error(e);
  }
});
</script>

</body>
</html>
