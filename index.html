<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — Статичные модели</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://unpkg.com/aframe@1.4.2/dist/aframe-master.min.js"></script>
<script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
  cursor:pointer;
  background:#fff;
  color:#000;
}
#start button:active {
  opacity:0.8;
}
#start button:disabled {
  opacity:0.6;
  cursor:not-allowed;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить</button>
</div>

<a-scene
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true; antialias:true;">

  <a-camera look-controls="enabled:false" position="0 0 0"></a-camera>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay: false; loop: true; volume: 0.5"></a-entity>

  <!-- Контейнер для статичных моделей -->
  <a-entity id="modelsContainer" position="0 0 -2" visible="false">

    <!-- Модель слева -->
    <a-entity
      gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
      position="-0.3 0 0"
      scale="0.05 0.05 0.05"
      animation-mixer="clip:*; loop:repeat">
    </a-entity>

    <!-- Модель справа -->
    <a-entity
      gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
      position="0.3 0 0"
      scale="0.05 0.05 0.05"
      animation-mixer="clip:*; loop:repeat">
    </a-entity>

  </a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const modelsContainer = document.getElementById('modelsContainer');
const music = document.getElementById('music');

startBtn.addEventListener('click', () => {
  startBtn.disabled = true;
  startScreen.style.display = 'none';

  // Запускаем музыку
  if (music && music.components && music.components.sound) {
    music.components.sound.playSound();
  }

  // Появление моделей через 5 секунд
  setTimeout(() => {
    modelsContainer.setAttribute('visible', true);
  }, 5000);
});
</script>

</body>
</html>
