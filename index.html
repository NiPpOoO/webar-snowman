<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 1Stable World Anchor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
#start {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  background: #000;
}
#start button {
  padding: 16px 28px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
}
#status {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.6);
  color: #fff;
  padding: 8px 12px;
  border-radius: 6px;
  z-index: 11;
  display: none;
}
</style>
</head>

<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:true"
  renderer="alpha:true; precision:mediump">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Скрытый маркер -->
  <a-entity id="marker" mindar-image-target="targetIndex:0" visible="false"></a-entity>

  <!-- МОДЕЛЬ В МИРЕ (НЕ ПРИВЯЗАНА К МАРКЕРУ) -->
  <a-entity id="world">
    <a-entity
      gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
      scale="0.05 0.05 0.05"
      animation-mixer="clip:*; loop:repeat">
    </a-entity>

    <a-entity
      gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
      position="0.5 0 0"
      scale="0.05 0.05 0.05"
      animation-mixer="clip:*; loop:repeat">
    </a-entity>
  </a-entity>

</a-scene>

<script>
const scene = document.querySelector('a-scene');
const marker = document.getElementById('marker');
const world = document.getElementById('world');
const status = document.getElementById('status');

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

// ===== THREE OBJECTS =====
const targetPos = new THREE.Vector3();
const currentPos = new THREE.Vector3();
const velocity = new THREE.Vector3();
const targetQuat = new THREE.Quaternion();
const currentQuat = new THREE.Quaternion();

let locked = false;

// ===== DESKTOP FALLBACK =====
if (!isMobile) {
  console.warn('PC MODE: MindAR disabled');

  // Камера
  const camera = document.querySelector('a-camera');
  camera.setAttribute('position', '0 1.6 3');

  // Показываем модели сразу
  world.object3D.position.set(0, 0, -2);
  world.object3D.visible = true;

  status.textContent = 'PC режим (AR отключён)';
  status.style.display = 'block';

  locked = true;
}

// ===== MOBILE (REAL AR) =====
if (isMobile) {
  const startBtn = document.getElementById('startBtn');
  const startScreen = document.getElementById('start');

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    startScreen.style.display = 'none';
    status.style.display = 'block';

    try {
      await scene.systems['mindar-image-system'].start();
    } catch (e) {
      alert('Ошибка камеры');
    }
  });

  marker.addEventListener('targetFound', () => {
    if (locked) return;

    marker.object3D.getWorldPosition(targetPos);
    marker.object3D.getWorldQuaternion(targetQuat);

    currentPos.copy(targetPos);
    currentQuat.copy(targetQuat);

    world.object3D.position.copy(currentPos);
    world.object3D.quaternion.copy(currentQuat);

    world.object3D.visible = true;
    locked = true;

    status.textContent = 'Маркер найден';
  });
}

// ===== STABLE UPDATE LOOP =====
scene.addEventListener('frame', () => {
  if (!locked || !isMobile) return;

  marker.object3D.getWorldPosition(targetPos);
  marker.object3D.getWorldQuaternion(targetQuat);

  velocity.subVectors(targetPos, currentPos);

  if (velocity.length() > 0.003) {
    velocity.clampLength(0, 0.04);
    currentPos.addScaledVector(velocity, 0.18);
    world.object3D.position.copy(currentPos);
  }

  currentQuat.slerp(targetQuat, 0.1);
  world.object3D.quaternion.copy(currentQuat);
});
</script>


</body>
</html>
