<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 1Статичные модели с анимацией</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- AR.js -->
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
}
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>

<a-scene embedded
         vr-mode-ui="enabled:false"
         renderer="alpha:true"
         arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- Камера -->
  <a-entity camera look-controls="enabled:false"></a-entity>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay:false; loop:true; volume:0.5"></a-entity>

  <!-- Контейнер для статичных моделей -->
  <a-entity id="modelsContainer" position="0 0 -2" visible="false">

    <a-entity id="leftModel"
      gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
      position="-0.5 -0.5 0"
      scale="0.05 0.05 0.05"
      animation-mixer>
    </a-entity>

    <a-entity id="rightModel"
      gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
      position="0.5 -0.5 0"
      scale="0.05 0.05 0.05"
      animation-mixer>
    </a-entity>

  </a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const modelsContainer = document.getElementById('modelsContainer');
const music = document.getElementById('music');

startBtn.addEventListener('click', () => {
  startBtn.disabled = true;
  startScreen.style.display = 'none';

  // Запускаем музыку
  music.components.sound.playSound();

  // Появление моделей через 5 секунд
  setTimeout(() => {
    modelsContainer.setAttribute('visible', true);

    // Запускаем анимацию моделей
    const models = modelsContainer.querySelectorAll('[gltf-model]');
    models.forEach(model => {
      model.addEventListener('model-loaded', () => {
        if(model.components['animation-mixer']){
          model.components['animation-mixer'].play();
        }
      });
    });
  }, 5000);
});
</script>

</body>
</html>
