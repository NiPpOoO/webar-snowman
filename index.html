<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — фиксированные модели</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:true;"
  vr-mode-ui="enabled:false"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Маркер (только для получения координат) -->
  <a-entity id="marker" mindar-image-target="targetIndex:0"></a-entity>

  <!-- Контейнер моделей -->
  <a-entity id="modelsContainer" visible="false">
    <a-entity gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
              position="-0.5 -0.5 0"
              scale="0.05 0.05 0.05"
              animation-mixer>
    </a-entity>
    <a-entity gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb"
              position="0.5 -0.5 0"
              scale="0.05 0.05 0.05"
              animation-mixer>
    </a-entity>
  </a-entity>

</a-scene>

<script>
const marker = document.getElementById('marker');
const modelsContainer = document.getElementById('modelsContainer');

// Переменные для хранения координат
let markerPosition = null;
let markerQuaternion = null;

marker.addEventListener('targetFound', () => {
  // Получаем мировые координаты маркера
  const pos = new THREE.Vector3();
  const quat = new THREE.Quaternion();
  marker.object3D.getWorldPosition(pos);
  marker.object3D.getWorldQuaternion(quat);

  // Сохраняем в переменные
  markerPosition = pos.clone();
  markerQuaternion = quat.clone();

  // Применяем к контейнеру моделей
  modelsContainer.object3D.position.copy(markerPosition);
  modelsContainer.object3D.quaternion.copy(markerQuaternion);
  modelsContainer.setAttribute('visible', true);

  console.log("Позиция маркера:", markerPosition);
  console.log("Ориентация маркера:", markerQuaternion);
});

marker.addEventListener('targetLost', () => {
  // НЕ скрываем — модели остаются навсегда
});
</script>

</body>
</html>
