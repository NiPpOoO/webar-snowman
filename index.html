<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — MultiMarker Fixed</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
  cursor:pointer;
}
#status {
  position:fixed; bottom:12px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  color:#fff; padding:8px 12px;
  border-radius:6px; z-index:11;
  display:none;
}
</style>
</head>

<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay: false; loop: true; volume: 0.5"></a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const status = document.getElementById('status');
const scene = document.querySelector('a-scene');

const markersCount = 6; // количество картинок в .mind

// Функция создания маркера с собственным контентом
function createMarker(index) {
  const marker = document.createElement('a-entity');
  marker.setAttribute('mindar-image-target', `targetIndex:${index}`);
  scene.appendChild(marker);

  // Контент для этого маркера
  const content = document.createElement('a-entity');
  content.setAttribute('visible','false');

  const snowmanModel = document.createElement('a-entity');
  snowmanModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox.glb');
  snowmanModel.setAttribute('scale','0.3 0.3 0.3');
  snowmanModel.setAttribute('animation-mixer','clip:*; loop:repeat');
  content.appendChild(snowmanModel);

  const secondModel = document.createElement('a-entity');
  secondModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb');
  secondModel.setAttribute('scale','0.25 0.25 0.25');
  secondModel.setAttribute('position','0.4 0 0');
  secondModel.setAttribute('animation-mixer','clip:*; loop:repeat');
  content.appendChild(secondModel);

  marker.appendChild(content);

  // События для конкретного маркера
  marker.addEventListener('targetFound', ()=>{
    content.setAttribute('visible', true);
    status.textContent = `Маркер ${index} найден`;
  });

  marker.addEventListener('targetLost', ()=>{
    content.setAttribute('visible', false);
    status.textContent = 'Наведи камеру на маркер';
  });

  return marker;
}

// Создаем все маркеры
for(let i=0;i<markersCount;i++){
  createMarker(i);
}

// Старт AR по клику/тапу
['click','touchstart'].forEach(evt => {
  startBtn.addEventListener(evt, () => {
    document.getElementById('start').style.display='none';
    status.style.display='block';
    try {
      const mindar = scene.systems['mindar-image-system'];
      mindar.start(); // синхронный вызов
      console.log('✅ MindAR запущен');
      const music = document.getElementById('music');
      if (music && music.components.sound) {
        music.components.sound.playSound();
      }
    } catch(e){
      alert('Камера недоступна или отказано в доступе. Обновите страницу и попробуйте снова.');
      console.error(e);
    }
  }, {once:true});
});
</script>

</body>
</html>
