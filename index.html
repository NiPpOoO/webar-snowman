<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 101</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
}
#start {
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  z-index:10;
}
#start button {
  padding:16px 26px;
  font-size:16px;
  border-radius:10px;
  border:none;
}
#status {
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  color:#fff;
  padding:8px 12px;
  border-radius:6px;
  font-size:14px;
  z-index:11;
  display:none;
}
</style>
</head>

<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<script>
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');
const status = document.getElementById('status');

startBtn.onclick = async () => {
  startScreen.remove();
  status.style.display = 'block';

  // SCENE
  const scene = document.createElement('a-scene');
  scene.setAttribute('mindar-image', `
    imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind;
    autoStart: false;
    smooth: true;
    smoothCount: 10;
    smoothTolerance: 0.01;
    smoothThreshold: 5;
  `);
  scene.setAttribute('renderer', 'alpha:true');
  scene.setAttribute('vr-mode-ui', 'enabled:false');
  document.body.appendChild(scene);

  // CAMERA
  scene.innerHTML += `
    <a-camera look-controls="enabled:false"></a-camera>

    <a-entity mindar-image-target="targetIndex:0">
      <a-entity
        position="0 -0.4 0"
        scale="0.35 0.35 0.35"
        gltf-model="https://nippooo.github.io/webar-snowman/assets/models/Fox.glb"
        animation-mixer="clip: mixamo.com; loop: repeat"
      ></a-entity>
    </a-entity>
  `;

  scene.addEventListener('loaded', async () => {
    await scene.systems['mindar-image-system'].start();
    console.log('MindAR запущен');
  });

  scene.addEventListener('targetFound', () => {
    status.textContent = 'Маркер найден';
  });

  scene.addEventListener('targetLost', () => {
    status.textContent = 'Наведи камеру на маркер';
  });
};
</script>

</body>
</html>
