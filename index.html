<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebAR — 137</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#start {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
}
#start button {
  padding:16px 26px; font-size:16px;
  border-radius:10px; border:none;
}
#status {
  position:fixed; bottom:12px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  color:#fff; padding:8px 12px;
  border-radius:6px; z-index:11;
  display:none;
}
</style>
</head>

<body>

<div id="start">
  <button id="startBtn">Запустить AR</button>
</div>
<div id="status">Наведи камеру на маркер</div>

<a-scene
  mindar-image="imageTargetSrc: https://nippooo.github.io/webar-snowman/assets/targets/snowman.mind; autoStart:false;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Музыка -->
  <a-entity id="music" sound="src: url(https://nippooo.github.io/webar-snowman/assets/sounds/music.mp3); autoplay: false; loop: true; volume: 0.5"></a-entity>

  <!-- Контейнер всех моделей -->
  <a-entity id="content-root" visible="false"></a-entity>

</a-scene>

<script>
const startBtn = document.getElementById('startBtn');
const status = document.getElementById('status');
const scene = document.querySelector('a-scene');
const contentRoot = document.getElementById('content-root');

const markersCount = 6;
let activeMarker = null;

// Smooth follow component
AFRAME.registerComponent('smooth-follow', {
  tick() {
    if (!activeMarker) return;
    const src = activeMarker.object3D;
    const dst = contentRoot.object3D;
    dst.position.lerp(src.position, 0.15);
    dst.quaternion.slerp(src.quaternion, 0.15);
  }
});
contentRoot.setAttribute('smooth-follow','');

// Создаем модели внутри contentRoot
const snowmanWrapper = document.createElement('a-entity');
snowmanWrapper.setAttribute('position','-0.3 -0.3 0');
const snowmanModel = document.createElement('a-entity');
snowmanModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox.glb');
snowmanModel.setAttribute('scale','0.3 0.3 0.3');
snowmanModel.setAttribute('animation-mixer','clip:*; loop:repeat');
snowmanWrapper.appendChild(snowmanModel);
contentRoot.appendChild(snowmanWrapper);

const secondWrapper = document.createElement('a-entity');
secondWrapper.setAttribute('position','0.3 -0.3 0');
const secondModel = document.createElement('a-entity');
secondModel.setAttribute('gltf-model','https://nippooo.github.io/webar-snowman/assets/models/Fox1.glb');
secondModel.setAttribute('scale','0.25 0.25 0.25');
secondModel.setAttribute('animation-mixer','clip:*; loop:repeat');
secondWrapper.appendChild(secondModel);
contentRoot.appendChild(secondWrapper);

// Создаем маркеры и подписываем события
for(let i=0; i<markersCount; i++){
  const marker = document.createElement('a-entity');
  marker.setAttribute('mindar-image-target',`targetIndex:${i}`);
  scene.appendChild(marker);

  marker.addEventListener('targetFound',()=>{
    activeMarker = marker;
    contentRoot.setAttribute('visible', true);
    status.textContent = 'Маркер найден';
  });

  marker.addEventListener('targetLost',()=>{
    setTimeout(()=>{
      if(activeMarker===marker){
        activeMarker = null;
        contentRoot.setAttribute('visible', false);
        status.textContent = 'Наведи камеру на маркер';
      }
    },200);
  });
}

// Старт AR по клику
startBtn.addEventListener('click', async ()=>{
  startBtn.disabled = true;
  document.getElementById('start').style.display='none';
  status.style.display='block';
  try {
    const mindar = scene.systems['mindar-image-system'];
    await mindar.start();

    // Запуск музыки
    const music = document.getElementById('music');
    music.components.sound.playSound();
  } catch(e){
    alert('Камера недоступна или отказано в доступе. Обновите страницу и попробуйте снова.');
    console.error(e);
  }
});
</script>

</body>
</html>
